# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.
#
# Every quoted value must OPEN AND CLOSE ON ONE LINE — this subset has no multi-line scalars,
# and a wrapped value is refused outright rather than silently truncated.

schema: 1
skill: fable-mind

# This skill needs NOTHING, and it is the only skill in the registry required to say so for a reason
# unrelated to code: it has no scripts/ at all. It is required because it OWNS A RULE -
# criterion.fable-mind, declared in skill.yaml and bodied at rules/criterion.fable-mind.md - and a
# rule owner carries a manifest so its DERIVED `config:` and `framework_hooks:` sections have
# somewhere to be reconciled against skill.yaml. Both are empty here: the skill owns a rule and
# nothing else.
#
# What the rule instructs (load the checkpoint layer on a non-Fable-class model) is a behaviour the
# agent adopts, not a dependency the skill resolves - there is no file to install and no sibling to
# call. An empty `requires:` is the whole truth: SKILL.md plus a rule body, portable anywhere.

requires:
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: criterion.fable-mind
      title: 'Fable-mind — load the checkpoint layer on a non-Fable-class model'
      body: rules/criterion.fable-mind.md

# DERIVED hash baseline (LF-normalized sha256) — do not hand-edit.
bundle:
