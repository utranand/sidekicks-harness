  VERSION.json: sha256:c7ca86ed74567fc580464ae8e206fe109f8eb60e0b640b29ac8d067ed061c9a2
  rules/criterion.fable-mind.md: sha256:96edd8b248195de25a994a96ef6636f7684258e203a5670d29a2e144e4315594
  skill.yaml: sha256:260f1078cf5acb8d4e54df3a4b03d75211e130bf963058e9c4a85d86b9ac323a
