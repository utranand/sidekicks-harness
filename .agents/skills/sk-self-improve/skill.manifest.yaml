#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-self-improve

requires:
  # Installed into the single repo-root .venv. `import:` is the name the code uses, so
  # verification can probe it without resolving pip metadata.
  python:
    - package: PyYAML
      import: yaml
      why: 'improvement artifacts, the per-skill index and the ledger are all YAML, and export_to_jira.py:32 imports it at module level - so the Jira export fails at import without it.'
      # seen at scripts/export_to_jira.py:32
  # Skills this one composes on. A sibling is never copied in and never auto-installed,
  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: sk-jira-connector
      how: subprocess
      entry: scripts/cli.py
      degraded: 'improvement artifacts can no longer be exported to Jira as subtasks. It degrades cleanly rather than crashing: export_to_jira.py:249-251 builds the absolute path to that skill''s cli.py, checks isfile, and returns a (None, reason) pair naming the missing CLI - so the export reports which artifacts it could not file instead of dying halfway through filing them. Everything else in this skill - PROPOSE, the approval gate, APPLY - never touches Jira.'
      # wired, seen at scripts/export_to_jira.py:249
    - skill: skill-creator
      how: handoff
      degraded: 'an approved artifact has no applier. This skill is the funnel and the gate, not the editor: SKILL.md:50-51 says a non-protected skill should be edited "via skill-creator directly", and export_to_jira.py:186-187 writes the same route into every Jira description it files ("Implement by approving + applying the artifact (self-improve APPLY -> skill-creator), not by hand-editing the skill"). Without it, PROPOSE still files evidenced artifacts and the approval gate still runs; what stops is the last step that turns an approved artifact into an edited skill.'
      # wired, seen at scripts/export_to_jira.py:187
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: criterion.self-improvement
      title: 'Skill self-improvement — opt-in, externally triggered'
      body: rules/criterion.self-improvement.md

