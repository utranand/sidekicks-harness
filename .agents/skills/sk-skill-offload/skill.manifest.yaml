# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-skill-offload

# This skill needs NOTHING. scripts/offload_skill.sh is POSIX shell over git and the two skill trees:
# it greps the repo for references to a skill, sorts them into blockers and soft pointers, and moves
# the folder between .agents/skills/ and .sidekicks/skill-offloaded/. No python, no npm package, no
# external binary beyond what a shell already has, and no sibling it calls. An empty `requires:` here
# is the finding, and it is the right shape for this particular skill: the thing that decides whether
# a skill can be parked must not itself be parked by a missing dependency.
#
# AUTHORED: findings a human read and REJECTED, each with the reason.
not_required:
  sibling_skills:
    - skill: skill-nickname
      why: 'offload_skill.sh:59 is a case pattern - `*/skill-nickname/*) soft+=("$f")` - that classifies a reference found UNDER that skill''s folder as a soft pointer rather than a blocker, because the alias registry naming a skill must not block offloading it. So the name is a path fragment in a filter, and the skill it names is data being sorted, not something invoked. Real shell code rather than a comment, which is why the finding''s wording had to be widened past "only in a comment" in the same change.'

requires:
  framework_files:
    - path: lib/framework-settings/registry.mjs
      degraded: 'TODO: state what breaks without this file'
      # seen at SKILL.md:40
    - path: lib/skill-lifecycle/references.mjs
      degraded: 'TODO: state what breaks without this file'
      # seen at SKILL.md:80

# DERIVED hash baseline (LF-normalized sha256) — do not hand-edit.
bundle:
  SKILL.md: sha256:05acced771e3ab0caed25270f2a27f748906a43ec2a9f2d0e3a8f7e700a1d858
  VERSION.json: sha256:a759c44a2a2b5cc742753248cc76f0be364ca40ef3e34f1236420ab4e010409a
  scripts/offload_skill.sh: sha256:e43490608a3d2dfe9f8f48d64b3dfcde7eb71eeee9b21a808e9054b9c51f8e00

# DERIVED executability baseline — do not hand-edit. Only executables are listed;
# a path here lands 0755, any other bundled path lands 0644. Recorded because a
# Windows checkout cannot report an exec bit, so a copy that passes through one
# loses it silently and no content hash can notice.
modes:
  scripts/offload_skill.sh: 755
