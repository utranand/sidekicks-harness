# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-packager

# AUTHORED: findings a human read and REJECTED, each with the reason.
#
# Eleven of the twelve detected rows come from ONE block, the "Implementation Reference" list at
# SKILL.md:313-326. That block is a MODULE MAP for a person editing the packaging engine: it says
# which lib/ file implements which verb. This skill never opens any of them - it drives the engine
# through `sidekicks package <verb>`, and the CLI is what imports lib/. Declaring them would state
# eleven dependencies with eleven false degraded: strings (the truthful one for all eleven is
# identical and belongs to the CLI, not here), and `skill heal` would then offer to restore engine
# internals on behalf of a skill that is pure prose. The map is documentation ABOUT the framework,
# which is the same call already recorded for the bmad/ paths in the scanner's own measurement.
not_required:
  framework_files:
    - path: lib/package-lifecycle/componentVersions.mjs
      why: 'SKILL.md:316, the Implementation Reference module map. Named to tell a maintainer where ensure/compare/check VERSION.json lives, not read by this skill.'
    - path: lib/package-lifecycle/plan.mjs
      why: 'SKILL.md:317, same map - the pure copy-plan builder.'
    - path: lib/package-lifecycle/assemble.mjs
      why: 'SKILL.md:318, same map - executes the copy plan.'
    - path: lib/package-lifecycle/create.mjs
      why: 'SKILL.md:319, same map - implements the `package create` verb this skill INVOKES through the CLI.'
    - path: lib/package-lifecycle/preview.mjs
      why: 'SKILL.md:320, same map - implements `package preview`.'
    - path: lib/package-lifecycle/transfer.mjs
      why: 'SKILL.md:321, same map - implements `package transfer`.'
    - path: lib/package-lifecycle/versions.mjs
      why: 'SKILL.md:322, same map - implements `package versions`.'
    - path: lib/package-lifecycle/overlay.mjs
      why: 'SKILL.md:323, same map - the upgrade-safe overlay.'
    - path: lib/package-lifecycle/validate.mjs
      why: 'SKILL.md:324, same map - validateSource plus validatePackage.'
    - path: lib/package-lifecycle/closure.mjs
      why: 'SKILL.md:325, same map - the import-closure analyzer.'
    - path: lib/package-lifecycle/index.mjs
      why: 'SKILL.md:326, same map - the barrel of pure engine functions.'

requires:
  # Repo-root files this skill runs or reads. They do NOT travel with the skill, so
  # `degraded:` has to say what a lifted copy loses.
  framework_files:
    - path: scripts/install-hooks.mjs
      degraded: 'the last step of package verification cannot run, so a freshly unpacked package boots with no git hooks wired. The step is explicitly optional at SKILL.md:307-309 ("optional but recommended") and everything the skill exists to prove still passes without it - the CLI boots and `project list` answers. The real cost is downstream and quiet: the operator receiving the package never gets the pre-commit gates, so the guard rails this repo relies on are absent in the copy rather than failing loudly in it.'
      # seen at SKILL.md:308. Unlike the eleven rejected rows this one is a COMMAND the skill tells
      # the operator to run, inside the produced package, where the file arrives as part of the
      # package payload - so a root that lacks it ships a package that lacks it.

