# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.
#
# Every quoted value must OPEN AND CLOSE ON ONE LINE — this subset has no multi-line scalars,
# and a wrapped value is refused outright rather than silently truncated.

schema: 1
skill: skill-creator

# Three scripts, one dependency between them. init_skill.py imports its sibling module
# generate_openai_yaml (intra-skill, so not a dependency), and quick_validate.py is the third
# consumer of the same package. Nothing here reaches another skill: skill-creator is the tool other
# skills are handed TO - sk-self-improve declares it, not the reverse.

requires:
  # Installed into the single repo-root .venv. `import:` is the name the code uses, so
  # verification can probe it without resolving pip metadata.
  python:
    - package: PyYAML
      import: yaml
      why: 'parses SKILL.md frontmatter and writes the per-CLI agents/openai.yaml port. Used by two of the three scripts - generate_openai_yaml.py:116 (a deferred import, after the frontmatter block has been regex-extracted) and quick_validate.py:10 (top level, so the validator does not start without it). init_skill.py needs it transitively through generate_openai_yaml.'
      # seen at scripts/generate_openai_yaml.py:116

