  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: sk-self-improve
      how: handoff
      degraded: 'this skill has nothing to apply WITH, and its one gate disappears. scripts/auto_improve.sh is only a prefilter - `proposed <skill>` lists artifacts and marks the additive-safe ones (risk low AND kind assets) - and its own comment at line 12-14 defers the decision: "The final purely-additive new file judgment still belongs to the agent + sk-self-improve''s auto-apply gate". So without that skill the prefilter still lists artifacts and nothing can be applied, which is the safe direction: the narrow auto-apply lane closes rather than opening unguarded. `handoff` rather than the generator''s `prose`: the shell script really does hand its shortlist on, it just never executes the other skill.'
