# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-knowledge

# This skill needs NOTHING installed. scripts/knowledge.mjs imports node:fs, node:path, node:crypto,
# node:child_process and node:process - stdlib only.
#
# One thing it emits is worth recording, because it looks like a dependency and is not: the generated
# HTML carries a Mermaid loader that does `await import('https://cdn.jsdelivr.net/npm/mermaid@11/...')`
# (scripts/knowledge.mjs:299). That import runs in the reader's BROWSER, never in Node, so mermaid is
# not an npm dependency of this skill and `skill heal` must never try to install it. The page is
# written to degrade on purpose: offline, the raw mermaid text stays visible inside its <pre> block
# rather than rendering as a blank box, so a CDN that cannot be reached costs formatting and nothing
# else. There is no requires: section that would state this correctly, so it is stated here.

requires:
  # DERIVED from skill.yaml — do not hand-edit.
  config:
    block: knowledge
    defaults: config.defaults.yaml

