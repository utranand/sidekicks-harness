# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-cli

requires:
  # Repo-root files this skill runs or reads. They do NOT travel with the skill, so
  # `degraded:` has to say what a lifted copy loses.
  framework_files:
    - path: lib/sk-cli/help.mjs
      degraded: 'the skill has nothing to answer from. Its entire method is to run the CLI and read the LIVE output, and SKILL.md:22-27 deliberately carries no verb list so that answers cannot drift as verbs are added (FR5.4). The rendered help comes from the VERBS table in this file, so without it there is no verb surface to report and a lifted copy can only restate the one command it knows.'
      # seen at SKILL.md:24
      #
      # This is the closest declarable file to the real dependency, which is the CLI ENTRYPOINT the
      # skill actually invokes: node bin/sidekicks --help. The scanner cannot see bin/ at all - its
      # repo-root pattern covers scripts/ and lib/ only - so no row would exist for it. Pinning
      # help.mjs is the useful half of the truth anyway: it is the file whose CONTENT this skill's
      # answers are made of, so a hash change here means the answers changed.

# DERIVED hash baseline (LF-normalized sha256) — do not hand-edit.
bundle:
