# Audit groups — named clusters of skills, AND the SOLE manifest of what the auditor may audit at all.
# This is the skill's BUNDLED, PORTABLE DEFAULT manifest: it travels with the skill so a fresh clone
# (or a repo with no auditor block in its AGENTS.md) audits a sensible set out of the box. The repo's
# AGENTS.md MAY OVERRIDE it — if AGENTS.md carries its own `skill-auditing groups:` block, that block
# WINS WHOLESALE and this default is ignored (see auditor.sh `group_md`). Edit this file to change the
# default; edit AGENTS.md to override per-repo without touching the skill.
#
# A run scoped to a group audits EXACTLY that group's members; an ungrouped run audits the UNION of
# all groups (the .sidekicks/skill-offloaded/ archive sits outside the scanned .agents/skills/ tree,
# so it is never in scope to begin with). The user MUST name the group to run a grouped audit
# — the auditor asks for one when groups exist.
# Edit freely: add a group, rename one, move a skill between groups. A skill may appear in more than
# one group (it's audited once). To keep a skill OUT of audits, leave it out of every group — there
# is no opt-out list. A NEWLY added skill is not audited until you place it in a group.
#
# FORMAT (parsed by auditor.sh): the `skill-auditing groups:` header at column 0, each group name
# indented, each member a `-` item indented further. Keep all comments either above this header or
# indented within the block — a column-0 line ends the block.
#
# DELIBERATE EXCLUSION: sk-skill-auditor itself is in NO group by design — its coverage
# comes from the `audit_self` knob in assets/audit-config.yaml, which injects it into ungrouped
# (whole-manifest) runs only. This is the documented exception to AGENTS.md's "register every
# first-party skill into a group" rule; do not "fix" it by adding the auditor to a group unless
# you also want it swept in that group's runs.
skill-auditing groups:
  # `single` is a RESERVED, ROTATING-CURSOR group — NOT a normal members list. Auditing it
  # ("audit the single group") audits exactly ONE skill per run and then auto-advances a saved
  # cursor to the NEXT skill, so running it repeatedly rolls through the whole registry one skill at
  # a time, picking up where it left off. The rotation pool is the UNION of every OTHER group below
  # (this `single` block is excluded from that union), and the cursor lives as run state at
  # artifacts/runs/skill-auditor/single-rotation.yaml (git-ignored, durable on disk). The member
  # line below is IGNORED for resolution — the real target comes from auditor.sh single-current;
  # steer with `auditor.sh single-reset [skill]`, inspect with `auditor.sh single-status`.
  single:
    - sk-jira-connector   # placeholder only — ignored; the audited skill is the rotating cursor
  jira:
    - sk-jira-connector
    - sk-jira-footprint
    - sk-jira-my-work
