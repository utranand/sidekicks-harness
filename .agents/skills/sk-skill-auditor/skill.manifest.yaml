# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-skill-auditor

# AUTHORED: findings a human read and REJECTED, each with the reason.
#
# THE FINDING FOR THIS SKILL: it names about a hundred siblings and depends on one. assets/
# audit-groups.yaml is the coverage catalog - every first-party skill listed under the group it is
# audited in - so nearly every skill in the registry appears there by name. The scanner reports all
# of them at `prose` confidence and audit.mjs does not raise a finding for a prose-only mention,
# which is exactly the design working: an AUDIT SUBJECT is not a dependency. A subject can be absent
# and this skill still works, because reporting its absence is the work. Same shape recorded for
# sk-parity-keeper, and for the same reason.
#
# The four rejections below are the ones that DID raise a finding, all from scripts/auditor.sh.
not_required:
  sibling_skills:
    - skill: sk-jira-connector
      why: 'scripts/auditor.sh:95 is inside the header comment that shows what a `skill-auditing groups:` block looks like, using two real skill names as the example rows. Documentation of a config format, in a comment, naming an audit subject.'
    - skill: sk-jira-my-work
      why: 'scripts/auditor.sh:96, the second line of that same example block. Same answer.'
    - skill: sk-implementation-planner
      why: 'scripts/auditor.sh:98, the example''s second group ("planning:"). Same answer.'
    - skill: skill-creator
      why: 'scripts/auditor.sh:521 explains which eval filename a skill might carry ("`evals.json` (skill-creator''s default)"). Provenance for a naming convention this script has to tolerate, not a call. The real edge to skill-creator belongs to sk-self-improve, which is what APPLIES an approved artifact.'

requires:
  # Installed into the single repo-root .venv. `import:` is the name the code uses, so
  # verification can probe it without resolving pip metadata.
  python:
    - package: PyYAML
      import: yaml
      why: 'the audit registry and every ledger this skill reads or writes are YAML - assets/audit-groups.yaml (the coverage catalog), the improvement artifacts it files, and the run ledger. audit_report.py:50 imports it at module level, so the report step fails at import without it.'
      # seen at scripts/audit_report.py:50
  # Skills this one composes on. A sibling is never copied in and never auto-installed,
  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: sk-loop-fleet
      how: subprocess
      optional: true
      degraded: 'SPAWN mode only (SKILL.md "SPAWN"): the launcher invokes scripts/fleet.py (fleet ledger) and scripts/loop.sh (per-worktree headless loop) by path. Without it, SPAWN cannot run — manual PARALLEL and every single-session mode are unaffected.'
    - skill: sk-cli-executor
      how: subprocess
      optional: true
      degraded: 'SPAWN mode only: loop.sh drives scripts/executor.py for each headless `claude -p` iteration. Without it, SPAWN cannot run — manual PARALLEL and every single-session mode are unaffected.'
    - skill: sk-self-improve
      how: handoff
      degraded: 'the findings this skill parks for a human have nowhere documented to go. audit_report.py:303-304 writes the instruction into the report itself ("The safety floor / failed verification refused these; they stay `proposed` until a human decides. Review each with `sk-self-improve`"), and SKILL.md:46 names it as where an approved artifact actually lands, including for this skill''s own autonomous lane. Auditing, filing proposals and reporting are unaffected - proposals are inert artifacts on disk - so what is lost is the APPLY end of the funnel, not the discovery this skill exists for. `handoff` rather than `subprocess` on purpose: nothing here executes that skill, a human or an orchestrator picks the report up.'
      # wired, seen at scripts/audit_report.py:304
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: criterion.skill-auditing
      title: 'Skill auditing — coverage, groups, autonomous mode'
      body: rules/criterion.skill-auditing.md
  framework_files:
    - path: lib/skill-lifecycle/export.mjs
      degraded: 'Nothing in the audit loop stops working — this file is CITED, not called. Finalize re-record gate points at the exporter that refuses a stale target (an unrecorded extra file is rejected exactly like a moved hash), so without it that reasoning loses its reference and a reader cannot confirm the gate guards a real constraint.'
      # seen at SKILL.md:712

