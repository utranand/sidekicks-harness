schema: 1
skill: sk-commander

requires:
  # Skills this one composes on. A sibling is never copied in and never auto-installed,
  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: sk-jira-footprint
      how: subprocess
      entry: scripts/footprint.py
      # OPTIONAL, and now stated as such in the contract rather than only in prose. The degraded
      # sentence below already described a fully working commander without this sibling — the call
      # is best-effort and its exit code is ignored — but `skill verify` graded any absent sibling
      # as an integrity ERROR, so a lightweight core that ships commander and not jira-footprint
      # failed a hard gate for a dependency it does not actually need. Absence of an optional
      # sibling is a notice; `--strict` still surfaces it.
      optional: true
      degraded: 'no per-step progress notes and no started/done bookends reach the card. The sequence itself is untouched: SKILL.md marks the call "best-effort — never fail the step over this" and instructs the runner to ignore any exit code and proceed, so the step''s real result stands.'
      # documented, seen at SKILL.md:405
  # DERIVED from skill.yaml — do not hand-edit. The rules and criteria this skill OWNS.
  framework_rules:
    - id: criterion.command-sequences
      title: A command-sequence exists to be executed
      body: rules/criterion.command-sequences.md

