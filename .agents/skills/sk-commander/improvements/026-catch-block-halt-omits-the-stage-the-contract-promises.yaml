# ▶ IMPROVEMENT ARTIFACT for the sk-self-improve skill ◀
id: 026-catch-block-halt-omits-the-stage-the-contract-promises
target_skill: sk-commander
created: 2026-08-28T03:20:00+07:00
source: 'sk-skill-auditor run audit-sk-commander-2026-08-28, round 3 (mid-tier probe on the Resume / ralph / Run-summary sections, gated at verify_tier=high). Anchors re-read by the gate: references/commander-workflow-template.js:560-569 against SKILL.md''s "Halt, don''t fake success" bullet and run-procedure step 6.'
kind: instructions
observation: >-
  SKILL.md states the halt contract in absolute terms — "**Halt, don't fake success** — the script returns
  `{ status: 'halted', stage, reason, summary }` on any unrecoverable failure (including a missing
  precondition caught by `try/catch`)" — and run-procedure step 6 tells the runner to use it: "On a halt,
  the returned `stage`/`reason` and the run ID are what the user needs to fix and resume."
  The template's `catch` block does not honour that shape. Every in-`try` halt carries the stage, e.g.
  line 554: `return { status: 'halted', stage: 3, reason: s3.error, stages, summary, event_sidecar: ev }`.
  The catch block (line 568) returns `{ status: 'halted', reason, stages, summary, event_sidecar: ev }` —
  no `stage` key at all. The exception path is exactly the one SKILL.md singles out as included ("a missing
  precondition caught by `try/catch`"), and it is also where an `event-sidecar-diverged` throw lands
  (lines 565-567), which the skill dedicates a whole section to. The template's own comment at line 166
  already writes the narrower shape without `stage`, so the two halves of the skill disagree in writing.
  Consequence: a runner following step 6 reads `result.stage` for a precondition or diverged halt and gets
  `undefined`, so the report names no stage for precisely the failures that are hardest to place — and the
  `stages` array, which does hold the answer, is not what step 6 points at.
  Skill-attributable: both the promise and the code are the skill's own, and SKILL.md instructs authors to
  keep the helpers verbatim, so a run cannot fix it by writing the script differently.
proposal: >-
  Make one shape true. Preferred, because it keeps the documented contract intact: in
  references/commander-workflow-template.js's catch block, include the stage — `stage: <the last stage
  index that was in flight, or null>` — deriving it from the `stages` array (the last entry whose status is
  not `todo`) so a precondition or diverged halt names where it stopped, and update the template's line-166
  comment to the same shape.
  Acceptable alternative if the catch block must stay minimal: narrow both SKILL.md claims — say that a
  halt raised by `try/catch` (a missing precondition, or `event-sidecar-diverged`) carries `reason` but no
  `stage`, and that the failing stage is read from the `stages` array's last non-`todo` entry instead.
  Either way edit both sides in the same change; the defect is the disagreement.
expected_effect: >-
  A halt's reported shape matches what the skill tells the runner to read, so the two failure modes that
  arrive through `catch` — a missing precondition and a diverged event sidecar — are reported with a stage
  instead of silently omitting one.
risk: low
