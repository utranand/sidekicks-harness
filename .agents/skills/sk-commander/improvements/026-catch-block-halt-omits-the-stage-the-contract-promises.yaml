applied_notes: 'PARKED 2026-08-28 by sk-skill-auditor run audit-sk-commander-2026-08-28 — FAILED adversarial verification 0/2 (both returned refuters at verify_tier=high refuted it; floor_hit=false on both, so parked as UNVERIFIED, not as a safety-floor case). The two anchors are byte-exact and the count is right (every live in-try halt carries `stage`; the catch at template:568 is the only one without it), but three of the artifact''s supporting claims are WRONG and the remedy is worse than the defect. (1) ATTRIBUTION ERROR, mine: the artifact says "SKILL.md instructs authors to keep the helpers verbatim, so a run cannot fix it" — the catch block sits BELOW the template''s own boundary comment `// STAGES — adapt everything below to the parsed sequence` (template:396), outside the keep-verbatim helper region banner at template:220, and its neighbouring hardcoded `stage: 0/1/2/3` returns are plainly illustration for the worked three-stage example. (2) NO CONSUMER: `grep -rn ''\.stage\b'' lib scripts .agents/skills/sk-commander` finds nothing reading the Workflow result''s `stage`. The only reader is the commander model, which always receives `stages` (a full per-stage status snapshot, which SKILL.md itself names as the authority for placing a halt and for filling `events.reconcile`) plus `reason` — strictly more information than the missing key — and the diverged throw text itself embeds the stage TITLE (template:169-170). (3) THE DOC BULLET IS SHORTHAND, not a struct contract: all four live halted returns also carry `stages` and `event_sidecar`, which the bullet under-lists, so the code already ''diverges'' in the other direction. (4) THE PREFERRED FIX IS UNSOUND: deriving ''the last entry whose status is not todo'' mixes numbering spaces (the in-try `stage:` is a hand-written 1-based LABEL, the array gives a 0-based INDEX), and it yields NOTHING in the exact case the artifact targets — a missing precondition can throw from `reconcileOnResume()`, the first statement inside the try (template:426), while every stage is still `todo`. In the `transition()` throw path it can also name a stage that had just been set `done`, which printed beside `status: ''halted''` reads as ''stage N failed''. WHAT A HUMAN COULD DO INSTEAD (both refuters converged on this, and it is a +1-line change): add one clause to SKILL.md step 6 — ''a halt raised by try/catch (missing precondition, event-sidecar-diverged) carries no `stage`; read the failing stage from `stages`'' — and optionally write `stage: null` at template:568 to document the absence honestly. Never take the code-deriving direction. Not a duplicate of 012 (same class, distinct instance), but a mismatch with no consumer and no failure mode is what the rubric says to drop rather than pad.'
