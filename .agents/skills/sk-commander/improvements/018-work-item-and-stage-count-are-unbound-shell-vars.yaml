applied_notes: 'Applied NARROWED per the refuters: explicit WORK_ITEM and STAGES_N bindings added beside RUNDIR/RUNREL/RUNID; the run.created append is now `${WORK_ITEM:+--work-item "$WORK_ITEM"} --detail "stages=$STAGES_N" --json` (whole flag conditional, detail quoted) with a sentence naming the reason — unquoted `stages=<n>` is shell redirection and creates a file called `--json`; `work_item: <slug>` documented as a third accepted top-level key with the caller-wins ladder, the per-step field left untouched; step 2 now also picks up work_item and the stage count. The proposed step RENUMBERING was NOT applied (refuted: a halt during the parse would then produce no run.created), and the "every run lands in _adhoc" claim was replaced with "a run CAN fall into _adhoc/sk-commander". || APPLY: auto-verified 2026-08-28: 3 refuters at verify_tier=high, 2/3 non-refuted, floor_hit=false on all three. Confirmed: WORK_ITEM has no assignment anywhere in the repo, `scope run-base sk-commander` resolves to artifacts/runs/_adhoc/sk-commander vs artifacts/runs/<item>/commander with an item, and bare "$WORK_ITEM" dies under `set -u`. The reproduce-lens refuter found a further defect in the same line: unquoted `--detail stages=<n> --json` is parsed by the shell as REDIRECTIONS — it created a file named `--json` and passed a valueless `stages=`. The consequence-lens refuter REFUTED the artifact''s strongest claim with disk evidence (3 of 5 real commander sidecars DO carry a work item: SDHPT-280/commander, start-shph-uat-services/commander, publish-sidekicks-harness-framework-core/commander) and showed the proposed step reordering would regress observability (a halt during the step-2 parse would produce no run.created, where today it does). APPLIED SHAPE, narrowed accordingly: bind both variables, quote/guard the flags, correct the overstated wording; the step renumbering is NOT applied.'
