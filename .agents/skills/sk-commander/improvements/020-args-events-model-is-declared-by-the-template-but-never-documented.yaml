applied_notes: 'Applied WIDENED per the correctness refuter: `model` documented in ALL THREE args.events shapes — the resume shape, the Run-events binding block and run-procedure step 5 — because EVENT_MODEL is consumed on the resume path too (template:209). Phrased as an optional LOW-TIER model resolved per CLAUDE.md''s tier table with the template''s own "verify it resolves in this runtime" guard preserved, cross-referencing the per-step model? field rather than restating tier guidance; omitting it inherits the session model. Answers the dissenting refuter''s Rule 6 objection. The template was not changed. || APPLY: auto-verified 2026-08-28: 3 refuters at verify_tier=high, 2/3 non-refuted, floor_hit=false on all three. Confirmed by repo-wide search: nothing outside the template and its verbatim harness copy ever sets events.model, so EVENT_MODEL is unreachable; lib/run-events/*.mjs has zero occurrences of ''model'' and run-event.mjs hardcodes actor.id, so no consumer can tell which model appended; the ~14-spawns-per-7-stage-run cost claim verifies. The dissenting refuter argued direction (B) — delete the field — on Rule 6 grounds (a vendor id baked into a path where emit() has no try/catch), and was outvoted; its concern is answered in the applied wording, which expresses the field as a low-TIER id resolved per CLAUDE.md''s tier table and keeps the template''s own ''verify it resolves in this runtime'' guard. APPLIED SHAPE widened per the correctness refuter: document the field in ALL THREE shapes (SKILL.md:290-292 as well as :353 and :607) because EVENT_MODEL is consumed on the resume path at template:209.'
