# ▶ IMPROVEMENT ARTIFACT for the sk-self-improve skill ◀
id: 020-args-events-model-is-declared-by-the-template-but-never-documented
target_skill: sk-commander
created: 2026-08-28T02:07:00+07:00
source: 'sk-skill-auditor run audit-sk-commander-2026-08-28, round 0 (high-tier discovery panel, gated at verify_tier=high). Anchors re-read by the gate: commander-workflow-template.js:79-90, 412; SKILL.md:353, 607, 290-292.'
kind: instructions
observation: >-
  The bundled template declares an `args.events.model` field and asserts as fact that the commander
  populates it: commander-workflow-template.js:79-80 documents the shape
  "{ runDir, runId, workItem, model: '<optional low-tier model id>', reconcile }", and lines 87-90 say
  "A LOW-tier model is the right lane for an event emitter (it runs one literal command and reports the
  exit code). The commander passes an id it has verified exists in this runtime; absent, the agent
  inherits the session model", backed by `const EVENT_MODEL = (EV && EV.model) || ''` used at lines 153
  and 209. SKILL.md — the only instruction telling the commander what to put in `args` — never mentions
  it: the three documented shapes are `events: { runDir, runId, workItem }` (SKILL.md:353), the same at
  step 5 (SKILL.md:607), and the resume shape listing only runDir/runId/workItem/reconcile
  (SKILL.md:290-292). So the template's assertion is false and the `EVENT_MODEL` branch is dead code:
  every event append spawns an agent on the session model. The cost is per transition, not per run —
  `transition()` calls `emit()` on each stage's `inprogress` and `done|failed`, so a 7-stage sequence
  pays roughly 14 top-tier agent spawns to write one-line JSONL entries.
  Wholly internal contradiction between two files of the same skill; no input can cause it.
proposal: >-
  Additive fix, matching the template's stated design intent: document `model` in SKILL.md's
  `args.events` shape at line 353 (and in the step-5 shape at line 607) as an OPTIONAL low-tier model id
  for the event emitters, with one sentence saying to verify the id resolves in this runtime before
  passing it (CLAUDE.md's tier table: Low = mechanical/bulk fan-out) and that omitting it makes the
  emitters inherit the session model. Do not change the template's helpers.
  (If pinning is judged unwanted instead, the alternative is to delete `model` from
  commander-workflow-template.js:79-80, 87-90, 90, 153, 209 and 412 so nothing claims a field the
  commander never sends — but the additive fix is preferred, since the template's comment states the
  low-tier lane is the right one.)
expected_effect: >-
  The template's claim becomes true and its low-tier emitter lane becomes reachable, so the diagnostic
  sidecar stops paying session-model spawns per stage transition; SKILL.md and the template agree on the
  `args.events` contract.
risk: low
