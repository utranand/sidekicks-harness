applied_notes: >-
  Applied through skill-creator as an improvement pass. (1) scripts/resolve-anchor.mjs — the
  string-concatenated guard `import.meta.url === `file://${process.argv[1]}`` replaced with the
  native-path realpathSync form, plus a 6-line comment naming the three failure modes so the idiom is
  not re-broken. Implementation note: the comparison is wrapped in try/catch and the resolve is
  hoisted to `const entry`, so a `node --eval` context whose argv[1] is not a real file returns false
  instead of throwing at import time — a hardening on top of the proposed const form, same truth table.
  (2) SKILL.md Step 3a — added the `[ -z "$VALUE" ] || [ -n "$resolved" ] || { echo …; exit 1; }`
  guard and a paragraph on why an empty anchor is not the same as no anchor.
  (3) `sidekicks skill manifest sk-commander --apply` re-recorded the bundle baselines
  (resolve-anchor.mjs 9761a251… → d8bab074…), so `skill heal --restore` can no longer put the bug back.
  VERIFIED empirically, all three failure modes retired on this machine: canonical path, the
  `.claude/skills` exposure symlink, and a copy under a directory named `with space` now ALL print
  `projects/shp-sk/artifacts/command-sequence` at exit 0 (the exposure and spaced shapes printed EMPTY
  before). An empty `$VALUE` still returns '' — the documented contract is intact.
  tests/skills/commander-resolve-anchor.test.mjs 7/7 pass; tests/skill-config.test.mjs green
  (25/25 combined). `sidekicks skill doctor sk-commander` → OK, 0 errors.
  Verification votes: 3/3 CONFIRMED, floor clear. NOT done here (out of scope, left for a human):
  tests/skills/commander-resolve-anchor.test.mjs L21 still loads via `file://${HELPER}`, the same
  broken construction, so the test cannot verify this fix on Windows or spaced paths — switch it to
  `toFileUrl()` from tests/fixtures/file-url.mjs and add a spaced-directory CLI case.
  FOLLOW-UP CLOSED in 0ff774bf: tests/skills/commander-resolve-anchor.test.mjs now loads via toFileUrl()
  from tests/fixtures/file-url.mjs and covers both broken shapes (spaced directory, symlinked directory;
  the symlink leg skips where Windows denies symlink creation). Proven to be a real regression net, not a
  tautology — both new shapes print EMPTY against the pre-fix helper taken from git, and the resolved path
  after it. 8/8 pass.
