# ▶ IMPROVEMENT ARTIFACT for the sk-self-improve skill ◀
id: 027-description-under-triggers-on-step-range-and-build-all-services
target_skill: sk-commander
created: 2026-08-28T04:10:00+07:00
source: 'sk-skill-auditor run audit-sk-commander-2026-08-28, step 2b (the triggering benchmark) — MEASURED with scripts/trigger_eval.py against the committed evals/trigger-eval.json from the neutral trigger-root at runs_per_query=3, num-workers=1, threshold=0.5. Four scoring runs total: incumbent twice, winning candidate twice (step 2b.4 replication).'
kind: description
observation: |-
  The FIRST measured triggering baseline for this skill is 14/20, replicated: two independent scoring runs of the shipped description on the committed 20-query set both returned 14/20 with an identical failure SET and total. That is a statement about this set in this
  session, NOT about the harness: 3 of the 10 positives churned per-query between the two incumbent runs
  (one trigger-unit each) behind that stable total, and this repo's archived auditor ledgers record a
  ~+/-4-query noise floor at runs_per_query=3, including identical-description replicates of 20/20 -> 12/20.
  The bar is cleared by margin rather than by assuming a quiet harness. All 10 negatives pass at 0/3 (no over-triggering). Two of the six should-trigger misses are description-addressable, and both MISS in both incumbent runs
  (threshold 0.5) — though NOT at identical rates, so here are the exact measured rates:
      0/3 then 0/3  "execute steps 1-5 of this sequence and fan stage 2 out across the three services in parallel"
      1/3 then 0/3  "build all three services at once from this numbered step list, each with its own work_dir"
  The shipped description never names either intent. It says "fanning a stage out to MANY subagents in parallel when its steps are independent" and "executed, orchestrated, resumed, fanned out" — abstract capability language — while the concrete phrasings a user actually types ("execute steps 1-5", "build all three services at once", "a numbered step list") appear only in the BODY's Trigger guidance, which the host never sees at skill-selection time (trigger_eval.py scores the frontmatter description alone). So the body advertises triggers the description withholds.
  The remaining four misses are NOT attributable to the description and are excluded from this finding: each names a file path, and a companion artifact filed and PARKED this run (025) records why their cause is unsettled — one path-bearing positive scores 3/3, so 'names a path' is not itself decisive.
proposal: |-
  Replace the frontmatter description with the measured winner below. It keeps every capability claim the current text makes, adds no claim the skill does not deliver, keeps the single terminal `NOT ...` sentence verbatim (it carries BOTH neighbour boundaries — sk-cli-orchestrator and sk-cli-executor — in one sentence), and is 740 chars / 746 UTF-8 bytes, well under the 1024 host cap.
  
  RUN a multi-step Sidekicks command-sequence — chain skill A, then a `sidekicks` CLI command, then skill B, each in its own subagent anchored to its own work_dir, fanning a stage out to MANY subagents in parallel when its steps are independent. Use when the user hands you a ready sequence — a file, or a pasted numbered step list — and wants it run: "run this sequence", "execute steps 1-5", "orchestrate these end to end", "build all the services at once", "fan a stage out across the services", "resume the halted run", or run it unattended/overnight (ralph persistence). NOT a queue of headless delegations to external executor CLIs (sk-cli-orchestrator owns that loop) or the single-item executor invocation it drives (sk-cli-executor).
  
  DE-FINGERPRINTED before applying, on all three refuters' advice: the scored candidate quoted the eval's own
  literals ("build all THREE services", "fan stage 2 out"). A description must describe the skill, not the
  benchmark, so those became "build all the services at once" (the body's own wording) and "fan a stage out
  across the services". That text is re-scored in its own right — see the evidence below — because those two
  queries ARE the entire measured gain and a de-fingerprinted text is a different instrument reading.

  MEASURED EVIDENCE (this is the whole basis for the change; per critique-criteria.md dimension 1 a single-run delta is not evidence, so both sides were scored twice on the same set):
      incumbent : 14/20, 14/20   (best observed 14)
      candidate : 16/20, 16/20   (worst observed 16)
  The winner's WORST beats the incumbent's BEST, which is the bar step 2b.4 sets. The delta is exactly the two queries named above — 0/3 -> 2/3 and 0/3 -> 3/3 in the replicated run — and NO negative regressed: all 10 still score 0/3, so the gain is not bought with over-triggering. Change nothing else: no body edit, no NOT-clause edit, no script.
expected_effect: |-
  Callers asking in the two phrasings the body already promises ('execute steps 1-5', 'build all N services at once from this numbered step list') reach the skill instead of missing it, with the neighbour boundaries measurably unchanged. It also closes the gap where the Trigger guidance advertised intents the description withheld from the host.
