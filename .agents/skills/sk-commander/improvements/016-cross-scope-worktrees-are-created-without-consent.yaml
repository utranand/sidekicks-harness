rejection_reason: >-
  0/3 — all three refuters rejected, and the premise is now SUPERSEDED by operator decision.
  The operator confirmed (2026-08-18) that `.sidekicks/memory/branch-autonomy-standing-grant.md`
  (commit 7e78674a, `rule: true`) is operator-directed: "Agents MUST cut/switch to <type>/<key>-<slug>
  and create sibling worktrees WITHOUT asking, dirty tree included … Never ask the operator to choose
  between equivalent mechanisms (worktree vs branch) — pick one, state it in one line, proceed." This
  artifact's entire expected_effect is "an attended cross-scope run asks once". That ask is exactly what
  the grant withdraws, so the fix is retired at the source. Worktree-ADD consent is not a floor id
  (floor.mjs carries only `rule.worktree-force-consent`, for `--force` removal), so the grant is a
  legitimate override, not a floor breach.
  Independent of the grant, the proposal failed on its own terms:
  (1) THE DISCRIMINATOR DOES NOT EXIST. No mechanism in this repo lets a skill detect whether a human is
  present — no env var, no TTY probe, no queryable harness flag. The only declarative proxy,
  `persistence: ralph`, appears in ZERO of 103 command-sequence files. And it inverts presence: the skill
  makes unattended reachable by PHRASING ("ralph this", "run it overnight"), so a human at the keyboard
  routes to the never-ask branch, while genuine ralph re-entry re-runs the whole pre-flight and would
  re-ask on every resume — the artifact specifies no ledger field to persist the yes.
  (2) THE SEQUENCE-FILE GRANT IS NOT A MECHANISM. The shp-sk precedent it cites is a `#` YAML COMMENT
  header — no key, no schema, parsed by nothing — which self-scopes to "THIS file and its start
  counterpart only", and AGENTS.md scopes it identically. The artifact never names the key, its shape,
  or where it validates, and a generalized version would sit in a file sk-sequence-planner AUTHORS:
  self-granted consent, which is what CLAUDE.md forbids for the branch-safety escape hatch.
  (3) THE SERIALIZE FALLBACK IS UNSAFE. Worktree isolation is the ONLY thing putting cross-scope member
  work on a dedicated branch. Serializing in the shared checkout lands every member's commits on
  whatever branch HEAD is on, with no branch check in the pre-flight — reaching the frozen-floor
  `rule.protected-branches`. It also falsifies the skill's own guarantee that it "does not run a
  cross-scope wave on shared state".
  (4) ITEM 2 LAUNDERS A DENIED LAYOUT. It has the commander state and proceed with a NESTED worktree
  location, which `enforce-branch-safety.mjs` DENIES outright and `worktrees-must-be-sibling-never-nested`
  forbids. The location claim itself is true but not for the reason given — proof is the harness tool
  contract, not the .gitignore inference, and `.gitignore` L41 `worktrees/` already matches L39 at any
  depth, so the pair is redundant defence, not a record of an observed path.
  (5) `risk: medium` understated: coherence needs ~13 SKILL.md sites plus a cross-skill planner change.
  WHAT SURVIVES: the OBSERVATION is fully verified and worth keeping on the record — no hook can see a
  harness-created worktree (`.claude/settings.json` wires branch-safety as `PreToolUse|Bash` only; the
  script reads `tool_input.command`; no gate anywhere keys on `isolation`), and CLAUDE.md's own claim
  that the hook "prompts on every add" is inaccurate for this path. Under the grant the residual duty is
  the grant's own: report where the worktrees landed. That is artifact 011's reporting half, not a gate.
  A METHOD FINDING WORTH MORE THAN THIS ARTIFACT: three of the twelve refuters treated the grant as
  decisive, and two asserted it was legitimate because "only `sidekicks memory` verbs write the store" —
  those verbs are agent-invocable. The provenance was settled by asking the operator, not by inspection.
  A `rule: true` entry cannot be distinguished from an agent-authored one by reading the store.
