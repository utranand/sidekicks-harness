applied_notes: 'Applied with the refuters'' exact wording: the template gained `wdSuffix`, `anchorFlags = [wdSuffix, docsSuffix, workItemSuffix].join("").trim()` and a branched `anchorLine`, so the sentence renders "Pass no anchor flags — let the skill use its own scope resolution" when no anchor exists and is BYTE-IDENTICAL to the previous output when work_dir is set (verified by rendering the real brief() before and after). The Fallback mirror now reads "Pass the anchors above that have a value ... if none are set, pass no anchor flags". `(omit)` no longer appears anywhere in the skill outside the improvement artifacts. Effective risk: low; the CLAUDE.md-precedence / 007-class framing in the observation is overstated and should be read as an instruction-consistency defect. || APPLY: auto-verified 2026-08-28: 3 refuters at verify_tier=high, 2/3 non-refuted (third vote not required), floor_hit=false on both returned (007''s Step-3a empty-anchor halt guard at SKILL.md:587-592 is untouched). The observation was settled by RENDERING the template literal: with no anchors it prints `Pass work_dir=(omit) to the skill so it anchors there`. History checked: the introducing commit (d35f65dd) is a bulk catch-all that never defends the placeholder, and at that commit docsSuffix/workItemSuffix did not yet exist — so work_dir was simply never retrofitted to the conditional form. `(omit)` is the sole occurrence in the repo, so it is no convention. Consumers verified: sk-bmad-pm, sk-bmad-developer and sk-database-analyst all state an explicit work_dir WINS and instruct skipping their own scope-resolution step. APPLIED SHAPE per the refuters: risk downgraded to low, the CLAUDE.md-precedence / 007-class framing dropped, anchors corrected to SKILL.md:449 and :457, and the replacement sentence BRANCHED (an explicit ''Pass no anchors — let the skill resolve its own scope'' clause) rather than pointing at ''the anchors above''.'
