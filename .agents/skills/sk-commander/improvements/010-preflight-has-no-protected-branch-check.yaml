rejected_by: adversarial-verification (3 independent refuters at verify_tier=high)
rejection_reason: >-
  0/3 — all three refuters rejected. The DIAGNOSIS is clean and survives: a grep of the current SKILL.md
  for `protected` / `branch --show-current` still returns zero hits, and CLAUDE.md's protected-branch
  hard rule names "commander sequences" by name. What fails is the remedy and the attribution.
  (1) THE NARROWING WAS AN ENGLISH QUALIFIER, NOT A PROCEDURE — and it is undecidable at pre-flight.
  The artifact says to resolve the branch over the DECLARED anchors. Run exactly that over the four
  sequences the artifact itself certifies as safe and all four trip: they declare `work_dir:
  projects/shp-sk`, and `git -C projects/shp-sk branch --show-current` -> `main` (it is a submodule).
  The only thing saving them is "...inside a repo it WILL EDIT" — a runtime property of a subagent that
  has not run. Strip the undecidable half and it collapses back to the unnarrowed trigger already
  refuted twice. Measured blast radius: ~66 of ~106 committed sequences would halt.
  (2) THE artifacts/runs/ CARVE-OUT IS VOID IN THE PROJECT IT WAS WRITTEN TO PROTECT.
  `git -C projects/shp-sk ls-files artifacts/runs | wc -l` -> 1029 TRACKED files (the `**/artifacts/runs/`
  ignore line is commented out in that submodule's .gitignore). So the carve-out contradicts the
  trigger's own head clause, and "implementation files" is never defined.
  (3) IT IS LOUDEST WHERE RISK IS LOWEST. The one committed family that genuinely writes implementation
  code — autopilot-dshph2-5586-todo-cards.yaml, six skill steps, the only anchorless skill steps in the
  repo, target repo resolved from a Jira card at RUNTIME — is invisible to the trigger. A gate that
  false-halts ops runs and waves through the real case trains bypass, leaving the hard rule with LESS
  enforcement than today.
  (4) MISATTRIBUTION. "The pre-flight is therefore the only gate that can exist" is false, and this
  repo's own wiring disproves it: `.claude/settings.json` already carries a `PostToolUse` matcher on
  `Write|Edit`, so an Edit/Write-matched hook is a shipped shape, not a hypothetical. 11+ skills have
  zero branch gating (only sk-git-ship gates itself), so filing against sk-commander fixes 1 of 11.
  (5) THE STATED RATIONALE FOR HALTING IS RETIRED. The proposal justifies a halt with "cutting a branch
  in a shared checkout needs the user's yes". The operator's `branch-autonomy-standing-grant`
  (confirmed operator-directed 2026-08-18) requires the opposite — cut and proceed, never block where
  the agent can act. sk-get-plan-done and sk-git-ship both CUT rather than halt; no engine halts.
  (6) The insertion point is actively dangerous: the artifact says insert before L462 "which is itself
  the wave-classification line". The pre-flight is now L445-456 and L462 is mid-sentence inside the
  sk-sequence-planner hand-off paragraph. Following it literally corrupts the document.
  SALVAGE, filed separately as docs/implementation-plans/branch-safety-commit-class/proposal.md: add a
  `commit`/`amend` class to `classify()` in scripts/enforce-branch-safety.mjs. Measured gap —
  `node scripts/enforce-branch-safety.mjs --command 'git add -A && git commit -m "feat: x"'` ->
  `{"allow":true}`, while `PROTECTED` already exists at line 71 and `classify()` falls through to
  `return null`. Decidable, false-halts no ops sequence, covers every path CLAUDE.md names.
  ALSO WORTH KEEPING (not filed): item 2, the `integrate()` merge-target assertion at template L219
  ("Merge these git branches into the current working branch") — decidable at merge time, correctly
  attributed to sk-commander, and the one piece a hook fix would NOT cover.
