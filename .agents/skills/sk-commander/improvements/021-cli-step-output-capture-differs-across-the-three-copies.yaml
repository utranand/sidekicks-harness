applied_notes: 'Applied in the artifact''s ALTERNATIVE direction (2:1 among the refuters): the over-claim "and return the stdout/stderr tail" was deleted from the "Things the template already encodes" bullet and replaced with what the template actually does (failure detail in `error`, no success-output field, and an explicit note that a tail never rides in handoff — one line, interpolated into every later brief); the Fallback CLI brief''s tail sentence became "On failure, put the stderr/exit detail in the error field." No STEP schema field added. All three copies now agree that only failure detail is captured. Effective risk: low, not medium. || APPLY: auto-verified 2026-08-28: 3 refuters at verify_tier=high, 3/3 non-refuted, floor_hit=false on all three. All three anchors verified byte-exact; the word ''tail''/''stdout'' appears nowhere in the template; not a duplicate of 013 (013 is one-directional loss inside the brief blocks, while this artifact''s leg 1 is an over-claim in the ''Things the template already encodes'' list, far above 013''s edit range — applying 013 in full would leave SKILL.md:225 wrong). No churn: `git log --all -S''stdout/stderr tail''` returns one commit (a tree move) and -S''commandOutput'' returns zero. APPLIED DIRECTION = the artifact''s ALTERNATIVE, 2:1 among the refuters: delete the over-claim rather than grow the STEP schema. All three refuters reject routing the tail through `handoff` — handoffs are joined into ctx and interpolated into every later brief, so a multi-line tail means formatting corruption plus untrusted-text injection; and the skill''s own run-event.mjs:134 already names a large stdout tail as a payload hazard. Effective risk is low, not medium.'
