target_skill: sk-commander
created: 2026-08-28T02:06:00+07:00
source: 'sk-skill-auditor run audit-sk-commander-2026-08-28, round 0 (high-tier discovery panel, gated at verify_tier=high). Evidence re-run by the gate: `grep -rniE "node_modules|link-deps|yarn install|npm install|npm ci" .agents/skills/sk-commander/` returns ZERO matches across the whole skill dir.'
kind: instructions
observation: >-
  Two of the skill's own instructions combine into an action CLAUDE.md forbids as a hard rule.
  SKILL.md:177-179 endorses fanning verification CLI steps out across services:
  "(Verification CLI steps — `npm test`/`lint`/`build` — only touch one service, so they fan out across
  services safely, like a developer wave.)" SKILL.md:165-168 then classifies exactly that shape —
  members with different `work_dir`s — as cross-scope and mandates "Run each member with
  **`isolation: 'worktree'`**". So a fanned-out `npm test` / `npm run build` wave runs each member inside
  a freshly created git worktree.
  CLAUDE.md's hard rule "Never install or build inside a worktree — symlink `node_modules`, run
  everything in the main checkout" forbids both halves of what such a member must then do: a fresh
  worktree carries no `node_modules`, so the command fails until something installs, and the step brief
  (commander-workflow-template.js:292-306) tells the agent to make the command succeed — which is the
  "reflexive `yarn install`" the rule names. The skill never mentions this anywhere: `node_modules`,
  `link-deps`, `npm install`, `yarn install` and `npm ci` have zero occurrences in the entire skill
  directory, so a sequence author following SKILL.md verbatim gets the forbidden action with no warning.
  The template repeats the endorsement at commander-workflow-template.js:445
  ("A verification gate is the same: { run: 'npm test', work_dir: 'projects/acme/services/svc-a/src' }").
  This is the skill's own defect, not a bad input's: both instructions are the skill's, and the sequence
  author is following them.
proposal: >-
  ADD a constraint (this softens nothing). In SKILL.md, replace the parenthetical at 177-179 with a
  carve-out that names the rule: a verification/build CLI step (`npm test`, `lint`, `build`, `tsc`,
  any install) MUST NOT be a cross-scope wave member, because a `isolation: 'worktree'` member starts
  with no `node_modules` and CLAUDE.md's "never install or build inside a worktree" hard rule forbids the
  install that would follow — serialize such steps in the main checkout, or (when a worktree is genuinely
  required) link the deps first with `sidekicks worktree link-deps <worktree-path>` and never install
  inside the tree. Add the same one-line caveat beside the existing nested-repo caveat at SKILL.md:258-262,
  add it to the step-3 pre-flight list (SKILL.md:556-562) as a classify-and-serialize item (information,
  not a halt), and correct the template comment at commander-workflow-template.js:445 so it no longer
  presents a build command as a free wave member.
expected_effect: >-
  The skill stops instructing a shape that violates a CLAUDE.md hard rule; build/test gates serialize in
  the main checkout where the toolchain lives, so a fanned-out verification wave no longer fails on a
  missing `node_modules` or "fixes" itself with a forbidden install.
