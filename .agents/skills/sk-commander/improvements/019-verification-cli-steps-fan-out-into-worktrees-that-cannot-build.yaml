applied_notes: 'Applied as ONE edit, reshaped per the refuters: the endorsing parenthetical became a paragraph stating that verification/build/install `run:` steps are EXEMPT from worktree isolation (a raw run: step never executes project use / service use, so it has no settings.json race), that they fan out plain-parallel in the MAIN checkout and never as isolation:worktree members (fresh worktree = no node_modules, no src/ for a nested-repo service), quoting CLAUDE.md''s hard rule, and that a verification stage belongs AFTER the post-barrier merge. Deliberately NOT applied: the 258-262 duplicate, the pre-flight list item, and the template comment change (that comment sits in the sequential single-step example, not a wave). The companion defect at its source is filed separately as sk-sequence-planner artifact 005 and left for a human. || APPLY: auto-verified 2026-08-28: 3 refuters at verify_tier=high, 3/3 non-refuted, floor_hit=false on all three (the change only ADDS a constraint). Independently confirmed: 20 service src/ trees carry package.json; the isolation runtime creates a plain git worktree with no node_modules and, for a nested-repo service, no checked-out src/ at all; AGENTS.md''s rule covers tests and builds, not only installs (''dev server, tests, builds and type checks execute in the primary local checkout''); enforce-branch-safety.mjs only prompts on install-class subcommands and never on `npm test`. APPLIED SHAPE, per the refuters'' corrections: ONE edit at SKILL.md:177-179 (the 258-262 duplicate, the pre-flight item and the template:445 change are all dropped — :445 sits in the sequential single-step example, not a wave), and the carve-out EXEMPTS verification/build CLI steps from worktree isolation rather than serializing them, because a raw `run:` step never executes `sidekicks project use` and so has no settings.json race at all. Open scope gap recorded for a human: sk-sequence-planner SKILL.md:220 and :365 carry the identical endorsement and that skill owns wave authoring.'
