rejection_reason: >-
  1/3 — one refuter CONFIRMED the diagnosis in full after re-verifying every quote against the current
  files; two rejected the proposal. The defect is real: `integrate` is called with only the SUCCEEDED
  branches (template L329) while its prompt says to enumerate with `git worktree list` and remove "each
  commander worktree" (L223-224), and the failed path does reach it.
  Why the apply is rejected anyway:
  (1) ITEMS 1 AND 4 HAVE NO DATA PATH. `integrate` ends `return !!(r && r.ok)` (L228) — the whole STEP
  payload is discarded and integrate's result is never `summary.push`ed. The failed member's STEP
  hardcodes `branch: ''` (L210). So "report its path and branch" has one boolean to travel on, the Run
  summary has an empty branch to cite, and the Workflow script has no filesystem access to run
  `git worktree list` itself. Item 3 makes it worse by design: `ok=true` on a refused removal means the
  only surviving bit says "fine".
  (2) A MATERIALLY DANGEROUS COORDINATE. Item 4 targets "SKILL.md L544-546"; those lines are now inside
  the example stage table (`| 2c | sk-bmad-developer …`). A line-addressed edit corrupts the table. The
  real target is L555-557. Every citation must be re-derived by text search.
  (3) MY OWN WARRANT WAS OVERSTATED. "The two paths disagree" is wrong: SKILL.md:425 says cite worktree
  paths INSTEAD of the scriptPath/runId, i.e. a resume-handle SUBSTITUTION, because the Fallback has no
  run ID. There is no policy inconsistency to "bring level"; item 4 is a genuinely NEW requirement.
  (4) KIND MIS-DECLARED. `kind: assets` + `risk: low` satisfies two of the three additive auto-apply
  predicates while the artifact edits two EXISTING files, neither under `assets/`. Should be
  `kind: instructions` / `risk: medium`.
  FLOOR: flagged by 1 of 3, and the other two rejected the flag with the better argument — the shipped
  skill has NO worktree-`--force` guidance at all (the single `--force` hit is `git push --force` at
  SKILL.md:454, non-worktree), so item 2 is net-TIGHTENING. The wording defect is real though: it makes
  "has the work been captured?" the operative test with the user gate trailing. Repair is to state the
  floor verbatim first, then the narrow no-loss carve-out.
  REACHABILITY, and this weakens 011/016/017 together: `git log --all -S'  - parallel:'` returns three
  commits ever, all touching only template assets. NO generated sequence with a `parallel:` wave has
  ever been committed, ~3 months back. `isolation: 'worktree'` is dead in all of git history, not merely
  unexercised — so "certain on first use of the flagship template" is a forecast about a template with a
  zero-instance record.
  NEW DEFECT FOUND WHILE VERIFYING, not covered here and not filed: the retry branch name is computed
  ONCE per member (template L309-313) and re-passed to all three attempts, so if attempt 1 created the
  branch, attempt 2 cannot check it out — a retry cascade unrelated to the work. 011 explicitly declines
  to touch branch naming.
  SALVAGE: fold 011 into ONE `integrate()` change together with 017 (they edit the same 14-line literal
  and the same six SKILL.md lines), after 017 has its own verification round. If anything is applied
  alone, item 1 only.
