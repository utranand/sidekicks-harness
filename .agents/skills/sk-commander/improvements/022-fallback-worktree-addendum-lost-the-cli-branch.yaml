applied_notes: 'PARKED 2026-08-28 by sk-skill-auditor run audit-sk-commander-2026-08-28 — FAILED adversarial verification 1/3 (refuted by 2 of 3 refuters at verify_tier=high; floor_hit=false on both, so this is parked as UNVERIFIED, not as a safety-floor case). Both refuters confirmed the anchors and the reachability but judged the consequence purely cosmetic: the `commander:` commit subject is produced in exactly one place, consumed by nothing (no script and no `git log --pretty` parse in sk-commander or sk-worktree-integrate), never surfaced by the Run summary table, and the branch is merged then deleted. Both also found it SUBSUMED: pending artifact 013 names worktreeAddendum() among the hand-copied blocks to replace with a pointer to the template, and pending 014 extracts the whole Fallback so the briefs DERIVE from the template — either fix resolves this for free, while 022''s own fix ADDS lines to the very block both propose to delete. A human deciding this should fold it into 013 as a fourth delta rather than apply it standalone. Two corrections to the observation, for whoever picks it up: the template anchors are :247 and comment :241-244 (not :248 / :242-245), and 022 MISSES the only non-cosmetic delta in that block — the template escapes quotes with .replace(/"/g, "''") while the hand-copied Fallback does not, so a `run:` containing a double quote breaks the `git commit -m "..."` shell string.'
