# ▶ IMPROVEMENT ARTIFACT for the sk-self-improve skill ◀
id: 022-fallback-worktree-addendum-lost-the-cli-branch
target_skill: sk-commander
created: 2026-08-28T02:09:00+07:00
source: 'sk-skill-auditor run audit-sk-commander-2026-08-28, round 0 (mid-tier discovery panel on the cross-copy-consistency angle, gated at verify_tier=high). Anchors re-read by the gate: commander-workflow-template.js:242-258 and SKILL.md:485-493.'
kind: instructions
observation: >-
  The template's `worktreeAddendum()` deliberately branches on step kind —
  commander-workflow-template.js:248 is `const what = isCli(step) ? `the command "${step.run}"` : `the
  skill "${step.skill}"`` and line 255 builds
  `git add -A && git commit -m "commander: ${what…} @ ${step.work_dir || 'root'}"` — with the comment at
  242-245 stating the addendum "is identical for both kinds". The Fallback's hand-copied addendum
  (SKILL.md:485-493) lost that branch: it hardcodes
  `git add -A && git commit -m "commander: <skill> @ <work_dir>"` with a literal `<skill>` slot and no CLI
  variant.
  The path is reachable, by the skill's own rules: SKILL.md:177-179 says non-registry-mutating
  verification CLI steps may be wave members, and SKILL.md:437-440 says every cross-scope member gets the
  worktree addendum. So in the Fallback path a CLI step can be handed an addendum telling it to commit
  "commander: <skill> @ …" for a step that has no skill — the agent either invents a skill name or commits
  the literal placeholder, where the Workflow path would correctly write
  `commander: the command "npm test" @ …`.
  An omission in a hand-copied mirror, not a design choice: the Fallback is introduced (SKILL.md:424-425)
  as the same intelligence with manual machinery.
proposal: >-
  Parameterise the Fallback's Worktree addendum exactly as the template does: in SKILL.md:485-493, replace
  the fixed commit-message line with the two-case form — `commander: the command "<run>" @ <work_dir>` for
  a CLI step and `commander: the skill "<skill>" @ <work_dir>` for a skill step — and say `@ root` when the
  step carries no `work_dir`, matching `step.work_dir || 'root'` at commander-workflow-template.js:255.
  Template unchanged.
expected_effect: >-
  A CLI step isolated in a worktree on the Fallback path produces the same meaningful commit message as on
  the Workflow path, so a wave's per-member commits stay attributable when the journal is absent.
risk: low
