# ▶ IMPROVEMENT ARTIFACT for the sk-self-improve skill ◀
id: 002-service-pull-is-registry-mutating
target_skill: sk-commander
created: 2026-06-19T04:08:00+07:00
source: sk-skill-auditor run 2026-06-19-audit — discovered while auditing the PAIRED skill sk-sequence-planner (high-tier panel). commander SKILL.md line 148 vs sequence-planner SKILL.md lines 156/190-191 vs lib/manifest-schema/service.mjs.
kind: instructions
observation: >-
  The commander's registry-mutating CLI list omits `service pull`. SKILL.md line 148 reads
  "registry-mutating commands (`sidekicks project create/add/remove/use`, `service add/remove/use`)";
  a grep for `pull` over the commander SKILL.md returns zero hits. But the PAIRED authoring skill
  sk-sequence-planner classifies `service pull` AS registry-mutating (its SKILL.md line 156:
  "`project use/create`, `service add/pull` all write the shared `.sidekicks/` registry"; line 190-191:
  "`project create/add/remove/use`, `service add/pull/remove/use`"), and that classification matches
  the source — `service pull` writes `branch`/`commit` into the per-project manifest
  (lib/manifest-schema/service.mjs). Consequence: the commander's Step-3 pre-flight (line 398) checks
  "no two registry-mutating CLI steps in one wave" using its own narrower list, so a sequence with two
  `service pull` steps in one wave would PASS the commander's pre-flight and run them concurrently —
  racing the shared manifest — even though the planner (correctly) would reject it. The two paired
  skills disagree on the same safety rule; the planner is right, the commander is missing `pull`.
proposal: >-
  Align the commander's registry-mutating list with the planner and the manifest-write reality: change
  SKILL.md line 148 from "`service add/remove/use`" to "`service add/pull/remove/use`" (and anywhere
  else the commander enumerates registry-mutating verbs), so `service pull` is treated as
  must-be-sequential / never-fanned-out and the Step-3 pre-flight catches two pulls in one wave.
expected_effect: >-
  commander and sequence-planner agree that `service pull` is registry-mutating; the commander's
  pre-flight no longer admits two `service pull` steps in one wave that would race the shared manifest.
risk: medium
status: applied
