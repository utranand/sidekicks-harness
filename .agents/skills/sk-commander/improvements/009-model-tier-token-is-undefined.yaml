rejected_by: adversarial-verification (3 independent refuters at verify_tier=high)
rejection_reason: >-
  0/3 — all three refuters rejected, on three independent grounds. (1) The proposal's own tier grammar is
  one value short: it defines `model_tier=<high|mid|low>` while every upstream asset defines FOUR
  (`top|high|mid|low` — sk-sequence-planner assets/command-sequence.template.yaml:47,
  assets/command-sequence.inline.txt:24, sk-cli-executor SKILL.md:182/184, sk-cli-orchestrator
  SKILL.md:284) and the artifact's OWN resolution list is four-wide. A planner-legal `model_tier: top`
  would still hit a spec that never defines it — the exact defect this artifact is filed against.
  (2) This is round THREE of a churn cycle, not a new fix. sk-sequence-planner/improvements/004 is
  `status: applied`, `approved_by: auto-verified`, "VERIFIED 3-0 (none refuted)", applied 2026-06-22,
  and it added literal `model=claude-sonnet-4-6` pins to the fan-out template's inline developer lines.
  Those same lines now read `model_tier=mid` (parallel-fanout-sequence.template.yaml:165-167) — an
  applied, 3-0-verified finding was overwritten by an un-propagated planner convention flip. 009 makes
  the COMMANDER absorb the flip, which is churn, against the auditor's own "converge, don't churn" bar.
  (3) Rule 6: `sonnet`/`opus`/`haiku` are Claude-only family names, so a baked alias is exactly as
  meaningless as `mid` on Codex or Gemini. Making tier->id CONFIG (the sk-cli-executor registry) rather
  than prose is precisely why that lane did it that way.
  Also fatal to the apply as written: item 4 edits a DIFFERENT skill's asset, which the funnel cannot
  record — `changes.files` is relative to the target skill dir, so the edit would be unrevertable from
  its own record. And the Fallback lane's step brief carries no `model` field at all, so a parse-time
  resolution is discarded on exactly the path the Fallback exists for.
  ONE EMPIRICAL POINT WENT THE ARTIFACT'S WAY and is worth keeping: bare aliases DO work — a committed
  run passed `model: 'sonnet'` and its journal records `claude-sonnet-5`, state done. But `top->fable`
  appears in ZERO of 80 journals, and `runStep` retries the SAME model 3x, so an unsupported alias burns
  the stage with no tier fallback.
  SALVAGE (all three refuters agree, not filed here): the wrong gloss is real and should go regardless —
  strike "e.g. `model_tier=mid`" from the `model=<id>` definition and change the two Examples to a
  `model=` pin. That is net-SUBTRACTIVE. Then file the ownership question against sk-sequence-planner,
  which is the origin of the doubled vocabulary, carries it on five surfaces, and states a falsehood
  about it ("an unavailable tier is a validation error" — sk-cli-executor:187-192 documents the
  opposite: no flag is passed, degrades cleanly).
