# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-hello

# AUTHORED: findings a human read and REJECTED, each with the reason.
#
# EMPTY, and worth a note because it was not. The one rejection here covered a sk-report edge
# the scanner saw in scripts/lib/config-schema.mjs, where a capability-registry row named that skill
# as the OWNER of `mail_sender` next to a path - data about who owns what, never something spawned.
# That file is retired: the capability audit asks the CLI now instead of keeping its own registry,
# so the edge no longer exists to reject. The rejection went with it rather than being carried
# forward, because a recorded judgment about a finding nobody can reproduce is indistinguishable
# from an unexamined suppression.

requires:
  # External commands. NEVER auto-installed — `skill heal` can only report these.
  binaries:
    - name: jq
      optional: true
      why: 'scripts/readiness.mjs probes for it (jqPresent, --version) and reports it as a readiness item. Optional because nothing in this skill parses JSON with it - readiness is a report ABOUT the operator machine, so an absent jq is a line item, never a failure of the skill.'
      install_hint: 'brew install jq, or let `readiness.mjs --apply` fetch the pinned single-file release (JQ_VERSION 1.7.1) into ~/.local/bin'
      install_hint_windows: 'winget install jqlang.jq, or the same --apply path into the user-local bin'
      # seen at scripts/readiness.mjs:273
      #
      # Note the asymmetry with the source ladder: `skill heal --apply` must NEVER install a binary,
      # and this skill's own readiness --apply CAN install this one. Both are correct. Installing is
      # a thing hello is explicitly asked to do; a health check that silently fetches binaries is
      # not. The install_hint above names hello's command rather than reimplementing it.
  # Repo-root files this skill runs or reads. They do NOT travel with the skill, so
  # `degraded:` has to say what a lifted copy loses.
  framework_files:
    - path: scripts/install-hooks.mjs
      degraded: 'the "Git hooks" readiness row reports N/A instead of a fixable gap. scripts/readiness.mjs:530-532 requires BOTH this script and .githooks/pre-commit to exist before it offers the row at all, because the check travels to layouts that carry neither - a mounted-core workspace keeps them inside .sidekicks-core/, and the core copy is the wrong target (install-hooks.mjs resolves its repo root from its own location, so it would set the hooks path of the core). Nothing is lost where the pair is absent by design; in a framework repo missing it, core.hooksPath drift stops being detected.'
      # seen at scripts/readiness.mjs:530
    - path: scripts/setup-windows.mjs
      degraded: 'nothing is lost - the mirror and skill-link rows fall back to a layout-neutral repair. readiness.mjs:514 tests for this script and, when it is absent (a mounted-core workspace has no scripts/ of its own), the mirror row recreates the symlinks inline with a byte-copy fallback for a Windows checkout without Developer Mode, and the skill-link row uses the CLI verb that self-heals junctions on Windows too. Where the script IS present it stays the Windows implementation, so there is still no Windows-only fork of it.'
      # seen at scripts/readiness.mjs:514
    - path: scripts/framework-core-publish.mjs
      degraded: 'the "Framework core (release debt)" readiness row is SKIPPED entirely - readiness.mjs guards on existsSync for both this script and the core service before adding it, so nothing errors and no other row is affected. The row is the only consumer: it spawns `status --json` and renders the result. Absence is therefore a lost signal (the release log stops being surfaced automatically) rather than a broken check, which is why this is a requires entry and not a hard dependency.'
      # seen at SKILL.md:175
  sibling_skills:
    - skill: caveman
      how: prose
      optional: true
      degraded: 'Nothing in sk-hello breaks. caveman is named only as documentation - it is one of the two token-discipline plugins the Host-plugins row installs, and the vendored .agents/skills/caveman/ copy exists solely to hold the criterion.caveman body. sk-hello never invokes it: the row is driven entirely by the enabledPlugins declaration in .claude/settings.json, so an absent caveman folder costs the criterion body and nothing else.'
      # documented, seen at SKILL.md:159
      #
      # optional: true and how: prose, not a hard subprocess edge. This row was the reason EVERY
      # forged core failed its own `core doctor --all` with
      #   [declared-but-absent] sk-hello: declares sibling 'caveman', which is not present
      # while the degraded sentence directly above said nothing breaks without it. Both halves were
      # wrong in the same direction:
      #   how: caveman is never invoked. SKILL.md's Host-plugins row is driven by the enabledPlugins
      #     declaration in .claude/settings.json; `prose` is the value for a named-but-not-called
      #     edge, `subprocess` claims a call site that does not exist.
      #   optional: absence is the EXPECTED state, not a defect. caveman is third-party (MIT) and
      #     declared-not-redistributed, so the `framework` preset deliberately excludes the skill
      #     folder and SKILL.md:157 tells the agent NOT to copy it in. SKILL.md:155: "A freshly
      #     mounted workspace has the declaration and not the package for both."
      # Same shape as sk-commander -> sk-jira-footprint, which lib/skill-lifecycle/audit.mjs names
      # as the precedent for why an optional sibling's absence is a notice and not an error.
      # `ponytail` gets the identical treatment in the same SKILL.md table and has NO row here at
      # all — there is no vendored ponytail folder for the scanner to find. That asymmetry is the
      # evidence this row was an artifact of the vendored folder rather than a real dependency.
    - skill: sk-skill-manager
      how: subprocess
      optional: true
      degraded: 'Step 0.75 cannot produce role/category/exact-skill recommendations or its public-catalog command sequence. Environment readiness, capability audit, and scope orientation remain fully available.'
      # documented, seen at SKILL.md:336

