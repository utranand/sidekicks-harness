  mechanism detail is preserved in SKILL.md Step 0. The lone refute argued the cap is an
  aggregate-budget rather than a hard 1024 cutoff, citing in-session skill-LIST display truncation
  — rebutted: that is a context-render artifact, not the host trigger matcher; the authoritative
  in-repo sk-skill-description-trimmer documents Claude's 1024 hard per-description cap, and
  the defect class already has precedent artifacts (sk-jira-my-work, sk-jira-footprint).
  Safety floor: all 3 refuters floor_hit=false (no safety/permission/irreversible rule touched;
  those live in SKILL.md body; single frontmatter string swap, cleanly git-reversible). Below floor
  → auto-apply lane.
