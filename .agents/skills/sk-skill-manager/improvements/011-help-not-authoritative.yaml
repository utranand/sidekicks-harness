id: 011-help-not-authoritative
target_skill: sk-skill-manager
created: 2026-08-28T05:40:00+07:00
source: >-
  sk-skill-auditor run audit-sk-skill-manager-2026-08-28, rubric dimension 6. Raised INDEPENDENTLY
  by both the mid-tier and high-tier discovery passes; the roster count was measured at the gate.
kind: instructions
observation: >-
  SKILL.md:39-40 states a rule that is false as written, and the file itself breaks it nine times:
    "**Never hardcode a flag list.** Every verb's real surface is `sidekicks skill --help` /
     `sidekicks framework --help`. A copied flag roster in a skill body is drift waiting to happen."
  Two measured problems.
  (1) `--help` is not the real surface. SKILL.md:350-352 makes `--category` mandatory — "Publish a
  family with `--category <family>`, never `--preset` … The intent gate refuses a preset-driven
  publish — correctly, but only after the wrong command was typed." But `node bin/sidekicks skill
  --help` prints the export row as `export <skill>... | --preset <p> [--output <path> |
  --destination <name>] [--with-deps] [--scope runtime|all] [--source-repo <url>] [--dry-run]
  [--strict] [--json]` — no `--category` (source: `lib/sk-cli/help.mjs:60`). The flag is real and
  load-bearing: `lib/skill-lifecycle/export.mjs:238` lists `category` among the value-taking flags
  and `:250-267` implements the selector. So an agent obeying the rule checks `--help`, does not
  find `--category`, and reaches for `--preset` — the one command this skill's EXPORT section
  explicitly forbids, and which the intent gate then refuses.
  (2) The file does exactly what the rule forbids: nine hardcoded flag rosters, at SKILL.md lines
  279, 337, 420, 569, 658, 676, 688, 689 and 758 (`grep -nE 'node bin/sidekicks skill [a-z-]+ .*\[--'`).
  Those rosters are useful — they are each mode's usage line — so the defect is the absolute rule,
  not the rosters. As it stands the skill states a prohibition it does not follow and points at an
  authority that is incomplete for the one flag it mandates.
  Skill-attributable: both contradicting statements are this skill's own. The `--help` gap itself
  lives in `lib/sk-cli/help.mjs`, outside this skill's folder, and is reported to the operator
  separately — this artifact only fixes what the skill says about it.
proposal: >-
  In `.agents/skills/sk-skill-manager/SKILL.md`, replace the absolute rule at :39-40 with the true
  one, and note the known gap where it bites:
    1. :39-40 becomes, in substance: keep each mode's short usage line, but do not treat any roster —
       this file's or `--help`'s — as exhaustive; confirm a flag against the verb's implementation in
       `lib/skill-lifecycle/` when it matters, because a copied roster drifts and `--help` is not
       generated from the parser.
    2. Add one clause at :350: `--category` is implemented (`lib/skill-lifecycle/export.mjs:250-267`)
       but is currently absent from `skill --help` (`lib/sk-cli/help.mjs:60`) — so its absence there
       is not evidence the flag is gone.
  Text-only edit to one file; the nine usage lines stay. No verb, behaviour or safety rule changes.
expected_effect: >-
  The skill stops stating a rule it breaks nine times, and stops routing an agent toward `--preset`
  for a family publish — the exact wrong command its own EXPORT section says the intent gate will
  refuse. A reader who cannot find `--category` in `--help` now knows why.
