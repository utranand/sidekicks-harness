id: 019-agent-tray-browses-under-ops
target_skill: sk-skill-manager
created: 2026-08-28T08:50:00+07:00
source: >-
  sk-skill-auditor run audit-sk-skill-manager-2026-08-28, round 2 (low tier, categories angle),
  rubric dimension 6. Re-verified at the gate against audit-groups.yaml, categories.yaml and the
  live published browse pages.
kind: assets
observation: >-
  `sk-agent-tray` browses on the published `ops` page instead of the `agents` page, and
  `assets/categories.yaml` — the file whose whole purpose is to let publication membership differ
  from audit membership — does not correct it.
  Evidence: `sk-skill-auditor/assets/audit-groups.yaml:134` lists `sk-agent-tray` under `ops:`,
  alongside `sk-cluster-ops`, `sk-security-remediation` and `sk-packager`. Its `agents:` group lists
  the other eight `sk-agent-*` skills (standby, creator, master, journal, bridge, schedule-planner,
  dry-run, mission-loop) and not the tray. Because a publication category defaults to the skill's
  audit group, and `categories.yaml` declares an explicit `members:` list for exactly one family
  (`framework`, at line 48), the tray inherits `ops`. Confirmed on the live public destination:
  `categories/ops/README.md` contains `sk-agent-tray`, and `categories/agents/README.md` does not.
  The blurbs make the mismatch plain. `ops` reads "Cluster ops, security remediation, packaging, UI
  capture, run and artifact doctors" — none of which is a menu-bar status app for delegate agents.
  `agents` reads "Persistent delegate agents: creation, standby loops, mailbox bridge, journals,
  scheduling" — which is what the tray is for. So a reader browsing the published `agents` family
  sees eight of the nine agent skills and is given no reason to think a ninth exists.
  This is precisely the case `categories.yaml` was built for. SKILL.md's own taxonomy section says
  the publication layer is separate because the `framework` family's "members audit under four
  different groups and browse as one", and that "before it, changing what the public repo showed
  meant changing what the auditor swept". The mechanism exists and is simply not applied here.
  Skill-attributable: `assets/categories.yaml` is this skill's own bundled asset and its resolution
  rule is this skill's to maintain.
proposal: >-
  In `.agents/skills/sk-skill-manager/assets/categories.yaml`, add an explicit `members:` list to the
  `agents:` family — mirroring the `framework:` pattern already in the file — naming the eight
  current `agents` audit-group skills plus `sk-agent-tray`. Do NOT move the skill between audit
  groups: `ops` may well be the right sweep for it, and the entire point of the publication layer is
  that browse membership can differ from audit membership without disturbing audit coverage.
  Note in the family's comment why the override exists (the tray audits under `ops` but belongs on
  the agents browse page), matching how the `framework` family documents its own exception.
  After the edit, regenerate the destination browse pages with
  `scripts/skill-repo-readmes-public.mjs` on the next publish; the change is inert until then.
expected_effect: >-
  The published agents family shows all nine agent skills rather than eight, and a reader browsing
  for delegate-agent tooling finds the tray instead of meeting it under "cluster ops, security
  remediation, packaging". Audit coverage is unchanged.
