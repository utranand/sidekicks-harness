# VERIFICATION RECORD — three independent adversarial refuters, each told to refute and to default to
# refuted when uncertain: lens A (factual correctness of every citation), lens B (is the proposal
# correctly aimed / would it make things worse), and a deciding third vote briefed to attack the
# angles the first two might have missed. Result: refuted=false, floor_hit=false on all three.
# Tally 3 of 3 non-refuted, 0 of 3 floor flags -> verified and below the floor -> auto-applied.

# CORRECTION ACCEPTED — it changed what was applied. The proposal said to list all nine agent skills
# under `members:`. Two verifiers objected, and the deciding vote settled the load-bearing question
# from the code: `categoryOf()` (lib/skill-lifecycle/export.mjs) matches a skill NAME anywhere in
# categories.yaml and returns the enclosing family; a skill named nowhere falls through to its audit
# group. So `members:` ADDS to the audit-group default — it does NOT replace it. Listing all nine was
# therefore redundant AND contrary to this file's own header ("their membership IS their audit group,
# so listing it here would be a second copy to keep in step for no gain"), creating exactly the
# two-places-to-maintain burden that convention exists to avoid. Applied instead: `members:` naming
# ONLY sk-agent-tray, the single member whose family cannot be derived, with a comment saying why.
# The other eight continue to resolve via groupOf() and are unaffected — confirmed by replaying the
# resolver over the edited file: sk-agent-tray now resolves to `agents`.
# The change is INERT until the next publish regenerates the destination browse pages; both README
# generators ignore `members:` and read membership from catalog.yaml's already-resolved `category`.
