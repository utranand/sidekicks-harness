kind: instructions
observation: >-
  `assets/not-carried-withholding.md` is a bundled asset with ZERO live references, and the
  consequence it exists to prevent has already happened at the published destination.
    - Deadness (whole-dir grep, per the rubric carve-out): `grep -rn not-carried-withholding
      .agents/skills/sk-skill-manager/` returns exactly one hit — `skill.manifest.yaml:88`, a sha256
      bundle record, not a use. A whole-repo grep including untracked files adds only three more
      sha256/hash records (the harness and skills-repo copies of the same manifest, and
      `inherit.json:118`). No script reads it and no SKILL.md line names it.
    - The consuming flag exists: `scripts/skill-repo-not-carried.mjs:49` parses `--append`, and
      `:168-170` appends each named file verbatim after the generated rollup. Its own comment at
      `:43-49` records precisely why: "Without this the addendum had to be hand-appended after the
      script ran, which meant the next regeneration silently dropped it — the exact durability trap
      this script was moved here to escape."
    - But nothing passes it. SKILL.md:307 invokes the script as
      `node .agents/skills/sk-skill-manager/scripts/skill-repo-not-carried.mjs --report <export.json>
      --out <root>` — no `--append` — and the script's own `Usage:` header at `:18-19` omits the
      flag too, so neither surface a caller reads mentions it.
    - Measured outcome at the configured public destination
      (`projects/global/services/sidekicks-skills/src/NOT-CARRIED.md`): `grep -c Withheld` returns
      **0**. The published rollup carries no withholding section at all — the durability trap the
      flag was built to escape is live in the published tree right now.
    - The asset is not merely idle: it is inside the export set and is recorded in `inherit.json`,
      so every consumer of the public skills repo and every forged runtime inherits the same unwired
      file.
  Skill-attributable: the asset, the invocation that omits the flag, and the script's own Usage
  header are all this skill's own files.
proposal: >-
  Wire the asset rather than delete it — the script, the asset and the stated reason all agree it
  should be passed:
    1. SKILL.md BOOTSTRAP step 5 (line 307): add `--append
       .agents/skills/sk-skill-manager/assets/not-carried-withholding.md` to the
       `skill-repo-not-carried.mjs` invocation, alongside the existing public-only note.
    2. Add `assets/not-carried-withholding.md` to SKILL.md's **References** list with one line
       saying what it is (the withholding addendum appended verbatim to a public destination's
       NOT-CARRIED.md, so a regeneration cannot silently drop it).
    3. Add `--append <file>` to the script's own `Usage:` header at
       `scripts/skill-repo-not-carried.mjs:18-19`, so the flag is discoverable from the script too.
  Additive documentation plus one flag added to a documented command line; no verb, behaviour or
  safety rule changes, and the script's existing refusal of a `dry_run: true` report (`:73-75`) is
  untouched.
expected_effect: >-
  The withholding addendum survives regeneration as designed instead of being an asset nothing
  invokes, and the next public NOT-CARRIED.md regeneration carries the section that is missing
  today. The skill stops shipping and publishing a file with no caller.
