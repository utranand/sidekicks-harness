# "10 should-trigger (ten of the sixteen modes — see 017)". So proposal item 2 is a no-op already
# done, and only item 1 — adding six should-trigger queries for ARCHITECT, VALIDATE, DESTINATIONS,
# REGISTRY, IMPORT->ADOPT and CATALOG, plus the two follow-ups 013 recorded — is outstanding work.
