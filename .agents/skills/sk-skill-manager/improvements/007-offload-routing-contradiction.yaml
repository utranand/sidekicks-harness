observation: >-
  sk-skill-manager's two routing surfaces give opposite answers for the same ask, and a third skill
  settles it against the body:
    - Its frontmatter description ends "NOT for offloading (sk-skill-offload)" — telling the host
      NOT to trigger this skill for a park/archive ask at all.
    - Its mode-routing table (SKILL.md:76) routes that exact phrasing here:
      `| "park X", "archive X", "turn X off but keep the files" | **OFFLOAD** — the verb is here,
      the judgement is sk-skill-offload's |`, backed by a full `## OFFLOAD` section (SKILL.md:673-684)
      that prints `node bin/sidekicks skill offload <skill> [--apply] [--restore] [--list] [--force]`
      and closes "this is only the engine".
  The claim that only the verb lives here does not hold: `sk-skill-offload`'s own SKILL.md runs the
  identical CLI verb itself (lines 58-62 — `skill offload`, `--apply`, `--force`, `--restore --apply`,
  `--list`), and its description claims the whole ask verbatim ("Use whenever the user wants to
  offload, archive, retire, deactivate, mothball, shelve, or 'turn off' a skill"). So the operation
  is owned end to end by the sibling, the description is right to disclaim it, and what is left here
  is a routing row plus an eleven-line command block that duplicates the sibling and contradicts this
  skill's own description. Two concrete costs: whichever surface a run reads first, the two disagree
  about whether this skill handles the ask; and the duplicated flag list can drift from
  sk-skill-offload's — a drift SKILL.md's own rule at line 39 ("Never hardcode a flag list") exists to
  prevent. This is skill-attributable: both contradicting sentences are this skill's own.
proposal: >-
  In `.agents/skills/sk-skill-manager/SKILL.md`, make the body agree with the description rather
  than changing the description (the description's routing is the correct one — the sibling owns the
  operation end to end):
    1. Rewrite the mode-routing row at line 76 so it hands off instead of claiming the mode, e.g.
       `| "park X", "archive X", "turn X off but keep the files" | -> **sk-skill-offload** — it owns
       this end to end, the CLI verb included |`.
    2. Replace the `## OFFLOAD` section (lines 673-684) with a short pointer that keeps the one
       genuinely useful distinction this skill is placed to make — OFFLOAD parks and REMOVE
       destroys, and the offloaded tree stays inside `SKILL_TREES` on purpose so rule ids, config
       block and hook wiring survive — and then sends the reader to `sk-skill-offload` for the
       operation. Drop the duplicated `node bin/sidekicks skill offload …` flag line, per this
       skill's own "never hardcode a flag list" rule.
  Keep the OFFLOAD-vs-REMOVE contrast; it is load-bearing for the neighbouring REMOVE section.
  Text-only edit to one file. No verb, no flag, no safety rule and no hard stop is changed — REMOVE's
  dry-run-by-default `--apply` gate and BOOTSTRAP's refusal to `git init` are untouched.
expected_effect: >-
  The description, the routing table and the body agree on one answer for a park/archive ask, and
  the duplicated flag roster that could drift from sk-skill-offload's stops being maintained in two
