kind: evals
observation: >-
  sk-skill-manager ships no `evals/trigger-eval.json`, so dimension 1 of the audit rubric
  (description triggering) cannot be MEASURED for it — the auditor's scorer refuses to run
  (exit 4) and the only remaining judgement would be an unmeasured opinion, which the rubric
  forbids filing. This matters more for this skill than for most: its description is a
  1131-character mode roster naming ten modes and six sibling skills it is NOT for, so
  over-triggering against `sk-skill-offload`, `sk-packager`, `sk-inherit`, `sk-skill-auditor`,
  `sk-self-improve` and `sk-parity-keeper` is the exact failure the description is written to
  prevent — and nothing today verifies that it does. Improvement 003 already trimmed this
  description once (1161 -> 1013 chars) with no committed query set to confirm the trim did not
  cost triggering; it has since grown back to 1131, over the 1024 host cap, unmeasured.
proposal: >-
  Add `.agents/skills/sk-skill-manager/evals/trigger-eval.json` — a 20-query triggering benchmark
  set, 10 `should_trigger: true` and 10 `should_trigger: false` near-misses, in the same schema the
  repo's other 35 eval sets use (a flat JSON array of `{query, should_trigger}`). The 10 positives
  cover one distinct mode each (CREATE, HEAL, EXPORT, IMPORT, REMOVE-local, REMOVE-destination,
  DISCOVER, REVIEW, ADVISE, BOOTSTRAP) so a description edit that drops a mode shows up as a
  measurable miss rather than passing silently. The 10 negatives are deliberate near-misses owned
  by the six siblings the description already disclaims plus sk-agent-creator, sk-config-doctor and
  sk-sequence-planner — they share this skill's vocabulary ("skill", "publish", "improve", "wire")
  but a neighbour should win. Exact content is the file authored by the audit run at
  scratchpad path trigger-eval.json; copy it verbatim to `evals/trigger-eval.json`. Purely
  additive — no existing file is touched.
expected_effect: >-
  Dimension 1 becomes measurable for this skill instead of unmeasurable: `auditor.sh score` runs,
  the current description gets a baseline number, and any future description edit (starting with
  the pending over-cap trim) can be shown not to cost triggering rather than assumed not to.
