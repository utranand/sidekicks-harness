id: 016-require-clean-bundle-inert
target_skill: sk-skill-manager
created: 2026-08-28T07:00:00+07:00
source: >-
  sk-skill-auditor run audit-sk-skill-manager-2026-08-28, round 1 (mid tier), rubric dimension 6
  (dead content). The probe's stronger claim — that export performs no staleness refusal at all —
  was CHECKED AND REFUTED at the gate; what survives is the narrower, verified finding below.
kind: assets
observation: >-
  `config.defaults.yaml:67` declares `require_clean_bundle: true` under `skill_repo.export`, with a
  comment written as though the key controls behaviour ("Refuse to export a skill whose bundle{}
  does not match disk. An export is a copy that will be verified somewhere else; exporting a stale
  tree just moves the drift."). Nothing reads it. A repo-wide grep returns exactly two hits: the
  declaration itself, and `lib/skill-lifecycle/destinations.mjs:206`, a JSDoc `@returns` annotation
  describing the SHAPE of a resolved-config object (`require_clean_bundle?: boolean`) that is never
  consumed.
  IMPORTANT — the behaviour itself is real, so this is a dead KNOB, not a missing guard. The gate
  verified that `lib/skill-lifecycle/export.mjs:183-184` collects stale entries and `:300-302`
  refuses with "skill export: refusing to export a stale tree — the recorded baseline does not
  describe the folder". SKILL.md's EXPORT claim "**Export refuses a stale tree**" (SKILL.md:393) is
  therefore TRUE and must not be touched. The defect is only that the refusal is UNCONDITIONAL and
  hardcoded while a configuration key advertises itself as governing it — so an operator who sets
  `require_clean_bundle: false` in a scope's `skills.yaml`, reasonably expecting to permit a stale
  export, gets the refusal anyway with no indication their setting was ignored. Skill-attributable:
  `config.defaults.yaml` is this skill's own declared config surface.
proposal: >-
  In `.agents/skills/sk-skill-manager/config.defaults.yaml`, keep the key (removing it would break
  any scope that has already set it) but rewrite its comment to state what is actually true: the
  staleness refusal is unconditional in `lib/skill-lifecycle/export.mjs` and this key does not
  currently gate it, so setting it to `false` does not permit a stale export. Mark it explicitly as
  reserved-for-future-wiring.
  Do NOT resolve this by deleting the export refusal or by making it conditional — that would turn a
  hardcoded guard into a switchable one, which is a safety-relevant change and is out of scope for
  this artifact. If the knob should genuinely become live, that is a separate framework change to
  `export.mjs` for a human to decide, and it should be filed as such.
expected_effect: >-
  The config file stops advertising control it does not have, so an operator cannot silently believe
  they have disabled a guard that is in fact unconditional.
risk: low
status: applied
approved_by: auto-verified
applied_at: 2026-08-28T09:15:00+07:00
