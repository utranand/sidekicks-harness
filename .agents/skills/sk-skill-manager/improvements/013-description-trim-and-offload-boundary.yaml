id: 013-description-trim-and-offload-boundary
target_skill: sk-skill-manager
created: 2026-08-28T06:20:00+07:00
source: >-
  sk-skill-auditor run audit-sk-skill-manager-2026-08-28, rubric dimension 1 — MEASURED by the
  triggering benchmark (scripts/trigger_eval.py via `auditor.sh score`, num-workers 1, 3 runs per
  query, scored from a neutral trigger-root), against the 20-query set committed by finding 004.
kind: description
observation: >-
  Two independent defects in the frontmatter description, one measured and one counted.
  (1) MEASURED, replicated. The incumbent description scores 19/20, twice — runs of
  19/20 and 19/20. Its sole failure is the same query both times, at the same decisive rate: "park
  sk-office-viz — turn it off but keep the files around" over-triggers at rate 1.00 (3 of 3), even
  though the description explicitly disclaims offloading and `sk-skill-offload`'s own description
  claims that phrasing verbatim ("offload, archive, retire, deactivate, mothball, shelve, or 'turn
  off' a skill"). A rate of 1.00 replicated across two runs is not sampling noise — the disclaimer
  as worded ("NOT for offloading (sk-skill-offload)") simply does not connect to how a user actually
  phrases the ask, which is "park", "archive" or "turn it off but keep the files". This is the
  measured half of finding 007: that artifact showed the routing table and the description
  contradict each other; this shows the description loses the boundary in practice too.
  (2) COUNTED. The description is 1131 characters against the 1024-character host cap — 107 over.
  This is a regression, not a standing state: improvement 003 trimmed it from 1161 to 1013
  specifically to fit under the cap, and it has grown back past it since, with nothing measuring or
  testing the limit.
  The candidate below fixes both. It scores 20/20, twice — runs of 20/20 and 20/20 — at 1018
  characters. Under the replication rule the rubric requires (the winner's WORST must strictly beat
  the incumbent's BEST), the bar is 20 > 19: cleared on every one of the four runs, with no run of
  either description deviating from its own result.
proposal: >-
  Replace the `description:` frontmatter in `.agents/skills/sk-skill-manager/SKILL.md` with the
  measured winner below (1018 chars, under the 1024 cap). Three substantive changes from the
  incumbent, each earning its place: the offload disclaimer is restated in the user's own words
  ("NOT for parking or archiving a skill, or turning one off while keeping its files") instead of
  the term "offloading", which is what fixes the measured over-trigger; BOOTSTRAP is named, a
  documented mode (SKILL.md's own routing row "set up a new skills repo") the incumbent description
  omitted entirely; and the redundant trigger phrases are dropped to buy the space ("unpublish X"
  is already covered by "retract X from the skills repo", and "I need something that can do X" /
  "find me a skill that" / "nothing here does X" all restate "is there a skill for X"). No claim
  about what the skill does is added, weakened, or invented — every mode named is one the body
  documents. Winning description, verbatim:
  |
  Front door for a skill's whole life in Sidekicks: CREATE one (via skill-creator), ARCHITECT its work_dir=/docs_dir= anchors, VALIDATE one (skill doctor/verify/manifest), HEAL one (install deps, restore bundle), BOOTSTRAP a skills repo, EXPORT/IMPORT skills to/from the configured skills repos, REMOVE one (delete it here and unwire it, or retract its published copy), DISCOVER an uninstalled skill by describing the task, report what is published where (DESTINATIONS), REVIEW drift and pick what to republish, ADVISE which siblings a skill needs. Use for "create a new skill", "is this skill built right", "this skill is broken", "publish these skills", "pull skill X in", "delete skill X", "retract X from the skills repo", "is there a skill for X", "what else do I need for X". NOT for parking or archiving a skill, or turning one off while keeping its files (sk-skill-offload); runtimes (sk-inherit); packaging (sk-packager); audits (sk-skill-auditor); improvements (sk-self-improve); CLI parity (sk-parity-keeper).
expected_effect: >-
  Triggering measured at 20/20 instead of 19/20, replicated; the skill stops claiming park/archive
  requests that belong to sk-skill-offload; and the description returns under the 1024-character
  host cap it has been 107 over, with a committed query set that will now catch the next regression.
risk: medium
