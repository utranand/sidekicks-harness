#   1. The proposal says four trigger phrases were dropped; the diff drops FIVE. "what needs
#      re-exporting / diff before I export" is also gone and is not covered by the stated redundancy
#      argument. It is measured safe (that query passes 1.00 in both candidate runs) and REVIEW's
