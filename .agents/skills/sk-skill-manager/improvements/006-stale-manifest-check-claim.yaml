observation: >-
  SKILL.md's VALIDATE section (lines 225-226) states a specific empirical fact that is no longer
  true, and the way it is worded guarantees it will keep going stale:
    "**Do not gate on `skill manifest --all --check`.** It exits 2 today: eight vendor skills have
     a manifest pending `create`. Gate on the skill you touched."
  Every load-bearing detail in that sentence is wrong against the live command. Running
  `node bin/sidekicks skill manifest --all --check` at the gate reported FIVE skills, not eight —
  sk-commander, sk-get-jira-done, sk-get-plan-done, sk-shp-backup-table, sk-skill-manager — every
  one of them `update (bundle baseline)`, not `create`, and NONE of them a vendor or adopted skill;
  they are all first-party skills authored in this repo. The mid-tier discovery pass, running the
  same command minutes earlier, saw FOUR rows — the set changed within a single audit run, which is
  the point: the count is a moving number that no test pins, so the sentence rots continuously and
  silently. The claim's own subject is now one of the offending rows — sk-skill-manager's manifest
  is itself stale against its bundle baseline. The durable half of the advice ("gate on the skill
  you touched, not the aggregate") is correct and worth keeping; only the frozen snapshot beneath it
  is wrong. This is skill-attributable rather than input-caused: the skill chose to record a
  volatile measurement as a standing fact.
proposal: >-
  In `.agents/skills/sk-skill-manager/SKILL.md`, replace the two-sentence bullet at lines 225-226
  with the durable claim alone, dropping the count and the cause:
    "- **Do not gate on `skill manifest --all --check`.** It is not a clean gate today — several
       skills carry a manifest stale against its bundle baseline, and the set moves. Gate on the
       skill you touched; run the aggregate only to see the current list."
  Keep the surrounding bullets unchanged. Text-only edit to one file; no verb, flag, behaviour or
  safety rule changes.
expected_effect: >-
  The instruction stops asserting a number and a cause that were already wrong and that nothing
  keeps current, while preserving the advice that actually matters (gate per-skill, not on the
  aggregate). A reader who runs the command no longer finds the skill contradicting the tool.
