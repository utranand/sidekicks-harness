# CORRECTIONS ACCEPTED — all four changed what was actually applied:
#   1. CROSS-PLATFORM DERIVATION. The proposal said "ideally derive from the constant". The third
#      verifier showed the two obvious derivations are BROKEN: join() yields '.agents\\skills' on
#      Windows while git always emits forward slashes, so both `target.startsWith(SKILLS_REL)` and
#      `SKILLS_REL.split('/')` pass on macOS and fail on Windows — a violation of the repo's
#      cross-platform rule, and the same class of silent drift as the original bug. The applied fix
#      uses the separator-agnostic form it specified:
#        const SKILLS_PARTS = SKILLS_REL.split(/[\\/]/);
#        ... parts[0] === SKILLS_PARTS[0] && parts[1] === SKILLS_PARTS[1] && parts[2]
#   2. OVER-FIRE CHECKED, none found. The parser applies no status-code filter, so untracked `??`
#      entries count — but `--ignored` is not passed and .gitignore covers node_modules/, __pycache__/
#      and .venv. Re-running with --untracked-files=all yields exactly ONE dirty skill. Note the
#      expected consequence: a skill self-flags as UNCOMMITTED right after an audit run writes its
#      improvements/ and evals/ files. That is the intended signal, not noise — export copies disk
#      bytes, so those files genuinely would be published unattributed.
#   3. MANIFEST RE-RECORD IS MANDATORY, not optional. skill.manifest.yaml records this script's
#      sha256 under bundle{}; without a re-record, `skill heal --restore` would put the OLD bytes
#      back from git and silently revert this fix. The bundle WAS re-recorded after applying.
#   4. REGRESSION TEST ADDED. The proposal offered only manual verification. Because this exact drift
#      already went unnoticed for eight days and nothing under tests/ covers this script at all, a
#      guard was added at tests/skills/skill-manager-picklist-dirty.test.mjs. It asserts the property
#      rather than the literal — that the match site and SKILLS_REL cannot disagree — so the next
#      canonical-tree move fails CI instead of going silent. MUTATION-VERIFIED: reintroducing the
#      original `.sidekicks` literal makes the suite fail with "the dead `.sidekicks` literal must not
#      come back"; restoring the fix returns 3/3 passing. That test file is repo-root surface, outside
#      the skill folder, so it is NOT part of this artifact's changes.files.
#   5. Reported, not fixed (pre-existing, out of scope): the git pathspec itself is SKILLS_REL, i.e.
#      '.agents\\skills' on Windows. Worth a forward-slash constant next time this function is touched.
