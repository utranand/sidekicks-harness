id: 018-picklist-dirty-detection-dead
target_skill: sk-skill-manager
created: 2026-08-28T08:45:00+07:00
source: >-
  sk-skill-auditor run audit-sk-skill-manager-2026-08-28, round 2 (low tier, script-internals angle),
  rubric dimension 6. Re-verified at the gate by replaying the function's own parsing logic against
  real `git status` output.
kind: scripts
observation: >-
  `scripts/export-picklist.mjs` cannot detect an uncommitted skill. `dirtySkills()` runs
  `git status --porcelain -- <SKILLS_REL>` where `SKILLS_REL = join('.agents', 'skills')` (line 57),
  so every path git returns begins `.agents/skills/...`. But the parser then tests
  `if (parts[0] === '.sidekicks' && parts[1] === 'skills' && parts[2]) dirty.add(parts[2]);`
  (line 139) — a condition that can never be true for output scoped to `.agents/skills`. The
  returned `Set` is therefore always empty.
  EMPIRICAL PROOF (gate, against the live working tree, which currently has uncommitted
  sk-skill-manager files): replaying the function's exact logic over real
  `git status --porcelain -- .agents/skills` output gives `dirty as SHIPPED (.sidekicks/skills): 0
  []` versus `dirty as FIXED (.agents/skills): 1 ['sk-skill-manager']`. The skill is dirty; the
  shipped code reports nothing.
  Everything downstream is consequently dead code: `checkboxLine()` (line 271,
  `if (row.dirty) bits.push('**UNCOMMITTED**')`) can never add the marker, and the `resolveCommands()`
  warning (line 439) can never fire — the one that says the destination's `origin.yaml` "would record
  a source_commit that does not contain these bytes".
  This is not cosmetic. SKILL.md's REVIEW section names `UNCOMMITTED` as one of exactly three flags
  "that change the decision", and states the consequence: "Export copies what is on disk but records
  the current commit as `source_commit` in the destination's `origin.yaml`, so exporting a dirty tree
  publishes bytes attributed to a commit that does not contain them. Committing first is the fix, not
  a nicety." So the skill documents a safeguard, tells the operator to act on it, and ships a
  pick list that silently never raises it — the operator reads a clean list and publishes
  misattributed bytes. `git log` shows the defect was introduced by commit `9c9654c1`
  ("refactor(skills)!: make .agents/skills the canonical tree") — the same commit that changed
  `SKILLS_REL`; the constant was updated and this parser was not. Skill-attributable: the script is
  this skill's own bundled code.
proposal: >-
  In `.agents/skills/sk-skill-manager/scripts/export-picklist.mjs` line 139, change the test to match
  `SKILLS_REL`:
      if (parts[0] === '.agents' && parts[1] === 'skills' && parts[2]) dirty.add(parts[2]);
  Better still, derive it from the constant rather than repeating the literals, so the two cannot
  drift apart again the next time the canonical tree moves — that drift is exactly what happened at
  `9c9654c1`. A one-line fix; no flag, interface, exit code or output format changes, and the
  UNCOMMITTED warning it restores is a warning the script already contains and already documents.
  Verify after the change by running `export-picklist.mjs plan` while a skill is uncommitted and
  confirming the row carries **UNCOMMITTED**.
expected_effect: >-
  The pick list can once again raise the flag SKILL.md tells the operator is decision-changing, so a
  dirty tree is caught before an export publishes bytes attributed to a commit that does not contain
  them — instead of the review reporting clean because the check is inert.
