# skill.manifest.yaml — what this skill needs in order to run.
#
# Sections under `requires:` are AUTHORED: generated once from what the scanner found, then
# maintained by hand. `config:`, `framework_hooks:` and `bundle:` are DERIVED — they are
# regenerated by `sidekicks skill manifest <skill> --apply` and a hand edit is reported as
# drift. Every `TODO` below is a question only a human can answer; `sidekicks skill doctor`
# keeps asking until it is gone.
#
# Writing prose here: `&word` and `*word` are refused by the yaml-subset reader ANYWHERE in
# a line, quoting and block scalars included (lib/yaml-subset/yaml.mjs findPoison) — so
# spell "and", and emphasize without asterisks, or the file stops loading.

schema: 1
skill: sk-skill-manager

requires:
  # Skills this one composes on. A sibling is never copied in and never auto-installed,
  # so `degraded:` has to say what happens when it is absent.
  sibling_skills:
    - skill: skill-creator
      how: handoff
      optional: true
      degraded: 'CREATE and every ARCHITECT repair lose their only applier. This skill authors nothing itself: it hands the change to skill-creator, exactly as sk-self-improve does, so with it absent the manager can still validate, heal, export, import and advise, but it cannot create a skill or edit one. Nothing here falls back to hand-editing a SKILL.md, because that is the practice the funnel exists to prevent.'
      # The scanner classifies this as `prose` — correct, there is no call site: the handoff is an
      # agent invoking a sibling skill, which no static scan can see. Declared here, not in
      # SKILL.md frontmatter depends-on, precisely because the dependency is real but optional:
      # this row is the richer optional/degraded contract that a hard frontmatter edge cannot
      # express, and inherit.mjs's declaredDependencies() treats every frontmatter depends-on
      # entry as hard and forge-blocking.
      # optional: true — skill-creator and sk-skill-auditor stay opt-in siblings (memory:
      # skill-manager-is-part-of-the-required-floor); the core floor carries sk-skill-manager
      # without either, so their absence is a notice (declared-optional-absent), never a
      # skill-verify/mount-check failure.
    - skill: sk-skill-auditor
      how: import
      optional: true
      degraded: 'CATALOG loses the family and first-party half of its answer, and ADVISE loses the family label and the bmad detector. The auditor owns assets/audit-groups.yaml, which is where group membership - and therefore the first-party vs external split the whole taxonomy rests on - is recorded. Without it category-doc.mjs can still fix the offloaded count and verify Sec 3, but it cannot derive Sec 1 or the grouped total, so it reports those as unavailable rather than computing a wrong number. The file is reached by walking up for .sidekicks/ from the repo root, never by a relative path out of this folder.'
      # wired, seen at scripts/category-doc.mjs:38. Root-anchored on purpose: a relative
      # ../sk-skill-auditor/ reach is `relative-cross-skill-import`, an error.
  # DERIVED from skill.yaml — do not hand-edit.
  config:
    block: skill_manager
    defaults: config.defaults.yaml
  framework_files:
    - path: lib/framework-settings/floor.mjs
      degraded: 'ARCHITECT loses the one list that says which ids are frozen, so the settings-split gate cannot tell a safety floor entry from an ordinary policy statement. Every finding it raises then reads the same, and the advice it gives for a hard stop (Rule 4, prod access, a credential) becomes "declare a criterion for it" - which is the exact opposite of correct, because a floor id written into any settings layer is a validation error. The skill still validates, heals, exports and imports; it is the ADVISE half that stops being trustworthy, and a wrong answer there is worse than no answer.'
      # seen at SKILL.md:154

# AUTHORED rejections — findings a human looked at and decided are not dependencies.
not_required:
  sibling_skills:
    - skill: sk-inherit
      why: 'named in a comment in scripts/category-doc.mjs explaining WHY Sec 1 is additive-only: that list is what inherit''s framework preset forges, so deleting a line would change what a runtime is built from. The script never invokes inherit and never reads its files. This is a provenance note that DENIES the dependency.'
    - skill: sk-packager
      why: 'named in the same comment as the concrete example of a Sec 1 member the classification rule does not derive. Naming a skill in order to say "do not touch this line" is the opposite of depending on it.'
    - skill: sk-architect-rules
      why: 'named as a plain string in PUBLIC_REPO_SIBLINGS, scripts/skill-repo-readmes-private.mjs:185, a fixed list this generator writes into a DIFFERENT repo''s NOT-CARRIED-style prerequisites prose (the destination''s own README, describing what that export omitted). sk-skill-manager never imports, invokes or hands off to it.'
    - skill: sk-cli-executor
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:185 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-commander
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:186 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-database-connector
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:186 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-database-rules
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:186 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-implementation-rules
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:187 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-jira-connector
      why: 'named as a plain string in CORE_ONLY_SIBLINGS, scripts/skill-repo-readmes-private.mjs:189, the private generator''s fixed list of siblings that ship inside the framework core rather than either skills repo — printed into a destination repo''s prose, not read or invoked by this skill.'
    - skill: sk-jira-footprint
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:187 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-jira-rules
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:187 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-scope-switch
      why: 'named as a plain string in CORE_ONLY_SIBLINGS, scripts/skill-repo-readmes-public.mjs:69, the public generator''s fixed list of siblings that ship inside the framework core rather than the public skills repo — printed into a destination repo''s prerequisites prose, not read or invoked by this skill.'
    - skill: sk-teleport-database-connector
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:188 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
    - skill: sk-validation-gate
      why: 'same PUBLIC_REPO_SIBLINGS list, scripts/skill-repo-readmes-private.mjs:188 — a name printed into a destination repo''s generated prose, not a dependency of this skill.'
  framework_files:
    - path: lib/framework-settings/core-registry.mjs
      why: 'named in SKILL.md only to explain WHY this skill claims criterion.new-skill-checklist through that file''s owners[] array rather than redeclaring it in skill.yaml. The skill never reads or runs the module, and a lifted copy loses nothing: the sentence explaining the mechanism travels with SKILL.md.'
    - path: lib/skill-lifecycle/known-gaps.mjs
      why: 'named in SKILL.md only to explain why anchor validation is a judgement mode rather than a repo-wide audit check, the shrink-only ratchet being the constraint. Citing the module that holds a rule is not reading it.'
    - path: lib/skill-lifecycle/_shared.mjs
      why: 'named in SKILL.md only to say WHERE the fixed backup path artifacts/runs/skill-manager/backups/<stamp>/<skill>/ is hand-joined, so a reader knows artifacts_dir= cannot move it. The skill never reads or runs the module; naming the file that implements a path is not depending on it.'
    - path: lib/skill-lifecycle/remove.mjs
      why: 'named in SKILL.md alongside _shared.mjs as the SECOND hand-join of the same backup literal — skill remove uses its own local backupSkill() rather than the shared helper. Cited to locate the behaviour, never read or invoked by this skill.'
    - path: lib/skill-lifecycle/export.mjs
      why: 'named in SKILL.md only to say that --category is genuinely implemented there even though sidekicks skill --help omits it, so its absence from the help roster is not read as the flag being gone. The skill drives the export VERB through bin/sidekicks, never this module directly.'

