# Skill descriptor — see lib/framework-settings/registry.mjs (discovered by scanning, no catalog).
#
# NO `rules:` BLOCK ON PURPOSE. The rule this skill is the front door for already exists as a
# framework-core entry: `criterion.new-skill-checklist` (lib/framework-settings/core-registry.mjs),
# whose body is in CLAUDE.md and which shipped with `owners: []`. A descriptor may NOT redeclare a
# core entry — buildRegistry() refuses it — so ownership is claimed by adding this skill to that
# entry's `owners[]` array, which is exactly what the array is for. That also means `framework
# sync` writes nothing here: the id is already listed in .sidekicks/framework.yaml, so the
# visibility rule stays satisfied without minting a second criterion that would only restate the
# 823-line architecture guide.
#
# config.block names this skill's OWN tuning block. One block, one owning skill, so the resolver
# never has two skills claiming the same defaults.

skill: sk-skill-manager

config:
  block: skill_manager
  family: skills
  defaults: config.defaults.yaml

# The settings-split detector fires on the paragraph that TEACHES the exemption mechanism: the line
# quotes "Python is ALWAYS the repo-root `.venv`" as its own worked example of a framework-owned
# restatement. Recording it here is the documented answer to the notice — and the example is itself
# one of the four kinds it names, so the exemption and the prose agree.
settings_split:
  policy_exempt:
    - quote: "the framework already owns (\"Python is ALWAYS the repo-root `.venv`\")"
      why: "not a policy of this skill. It is a QUOTED EXAMPLE inside the paragraph that documents when a policy statement is not declarable, and the thing quoted is a framework-core rule (rule.single-venv) that CLAUDE.md already owns. Declaring a criterion here would mint a second, skill-local copy of a rule the framework states once - which is precisely the duplication this gate exists to prevent."
